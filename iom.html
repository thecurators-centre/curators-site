<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта ИОМ | The Curator’s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 20% 0%, #2f3350 0%, #25283d 60%);
  }

  header {
    padding: 15px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border-bottom: 1px solid rgba(244, 243, 238, 0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-container img { width: 150px; height: auto; }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .header-right span { font-size: 0.9rem; opacity: 0.7; }
  .btn-back {
    color: var(--accent-lime);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    border: 1px solid var(--accent-lime);
    padding: 8px 15px;
    border-radius: 10px;
    transition: 0.3s;
  }
  .btn-back:hover { background: var(--accent-lime); color: var(--bg-color); }

  .container {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 5% 80px;
  }

  .page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 30px;
  }
  .page-head h1 {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .page-head h1 span { color: var(--accent-lime); }
  .page-head .subtitle {
    font-size: 1rem;
    color: rgba(244, 243, 238, 0.65);
  }

  .map-wrapper {
    position: relative;
    background: var(--card-bg);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 40px 20px;
    min-height: 400px;
    overflow-x: auto;
    overflow-y: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .map-wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(197,240,90,0.08) 1px, transparent 1.4px);
    background-size: 24px 24px;
    pointer-events: none;
    opacity: 0.6;
  }
  #map-canvas {
    position: relative;
    width: 100%;
    min-height: 400px;
    overflow: visible;
  }
  #map-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1; /* Повыше, чтобы линия была видна */
    overflow: visible;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    font-size: 1.1rem;
    opacity: 0.5;
    position: relative;
    z-index: 2;
  }

  .btn-add {
    background: var(--accent-lime);
    color: var(--bg-color);
    border: none;
    padding: 12px 22px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 8px 20px rgba(197,240,90,0.25);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-add:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(197,240,90,0.4); }
  .btn-add:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Статистика сверху */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 130px;
  }
  .stat .v { font-size: 1.4rem; font-weight: 800; color: var(--accent-lime); }
  .stat .k { font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.08em; }

  /* Модалка зоны */
  .zone-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .zone-modal.active { display: flex; }
  .zone-modal-content {
    background: var(--bg-color);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .zone-modal-content .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-main);
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
    opacity: 0.6;
  }
  .zone-modal-content .close-btn:hover { opacity: 1; }
  .zone-modal-content h2 {
    font-size: 1.25rem;
    margin-bottom: 6px;
    color: var(--accent-lime);
  }
  .zone-modal-content .zone-hint {
    font-size: 0.85rem;
    color: rgba(244, 243, 238, 0.55);
    margin-bottom: 18px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    color: rgba(244, 243, 238, 0.75);
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--card-bg);
    color: var(--text-main);
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent-lime);
  }

  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions .btn-save {
    flex: 1;
    background: var(--accent-lime);
    color: var(--bg-color);
    border: none;
    padding: 13px 18px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .modal-actions .btn-save:hover { transform: translateY(-2px); }
  .modal-actions .btn-delete {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 13px 18px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .modal-actions .btn-delete:hover { background: rgba(255,107,107,0.12); }
  .modal-actions .btn-cancel {
    background: transparent;
    color: rgba(244,243,238,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 13px 18px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    header { padding: 12px 4%; }
    .logo-container img { width: 120px; }
    .header-right span { display: none; }
    .container { padding: 20px 4% 60px; }
    .map-wrapper { padding: 20px 10px; }
    .page-head { flex-direction: column; align-items: flex-start; }
  }

  /* === Слой зон (Карта) === */
  .zone-layer {
    position: relative;
    width: 100%;
  }
  .zone {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3d4170 0%, #2c2f52 100%);
    border: 3px solid var(--accent-lime);
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.25);
    z-index: 2;
    padding: 6px;
    text-align: center;
  }
  .zone:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 16px 32px rgba(0,0,0,0.55), 0 0 0 4px rgba(197,240,90,0.18);
  }
  .zone:active { transform: translateY(0) scale(0.98); }

  .zone-test {
    background: radial-gradient(circle at 30% 30%, #7a2a3a 0%, #4a1828 100%);
    border-color: var(--danger);
    box-shadow: 0 10px 24px rgba(0,0,0,0.45), 0 0 0 6px rgba(255,107,107,0.12), inset 0 -3px 0 rgba(0,0,0,0.25);
  }
  .zone-test:hover {
    box-shadow: 0 16px 32px rgba(0,0,0,0.55), 0 0 0 8px rgba(255,107,107,0.22);
  }

  .zone-num {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--bg-color);
    border: 2px solid var(--accent-lime);
    color: var(--accent-lime);
    font-family: monospace;
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .zone-test .zone-num {
    border-color: var(--danger);
    color: var(--danger);
  }

  .zone-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .zone-label {
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text-main);
    max-width: 100%;
    padding: 0 4px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .zone-test .zone-label {
    font-size: 0.78rem;
    color: #ffd9d9;
  }
  .zone-sub {
    font-size: 0.85rem;
    font-weight: 800;
    font-family: monospace;
    color: var(--accent-lime);
    margin-top: 2px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zone-test .zone-sub {
    color: #ffb3b3;
    font-size: 1rem;
  }
</style>
</head>
<body>

<header>
  <a href="admin.html" class="logo-container" id="logo-link">
    <img src="logo.png" alt="Logo">
  </a>
  <div class="header-right">
    <span id="student-name">Загрузка...</span>
    <a href="admin.html" class="btn-back" id="back-btn">← Вернуться</a>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <div>
      <h1>Карта <span>ИОМ</span></h1>
      <p class="subtitle" id="page-subtitle">Маршрут ученика по темам и контрольные срезы</p>
    </div>
    <button class="btn-add" id="add-btn" style="display: none;">+ Добавить урок</button>
  </div>

  <div class="stats" id="stats" style="display: none;">
    <div class="stat"><span class="k">Пройдено уроков</span><span class="v" id="stat-lessons">0</span></div>
    <div class="stat"><span class="k">Контрольных срезов</span><span class="v" id="stat-tests">0</span></div>
    <div class="stat"><span class="k">Последний срез</span><span class="v" id="stat-last">—</span></div>
  </div>

  <div class="map-wrapper" id="map-wrapper">
    <div id="map-canvas">
      <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="loading">Загрузка маршрута...</div>
    </div>
  </div>
</main>

<!-- Модалка редактирования зоны -->
<div class="zone-modal" id="zone-modal">
  <div class="zone-modal-content">
    <button class="close-btn" id="close-zone-modal">×</button>
    <h2 id="zone-title">Урок</h2>
    <p class="zone-hint" id="zone-hint">Название темы урока</p>
    <div class="form-group">
      <label id="label-title" for="zone-input-title">Тема урока</label>
      <input type="text" id="zone-input-title" placeholder="Например: Сила тяжести" maxlength="80">
    </div>
    <div class="form-group" id="group-result" style="display: none;">
      <label for="zone-input-result">Результат среза</label>
      <textarea id="zone-input-result" placeholder="Например: 12 из 15" rows="2" maxlength="120"></textarea>
    </div>
    <div class="modal-actions" id="modal-actions">
      <button class="btn-save" id="btn-save">Сохранить</button>
      <button class="btn-delete" id="btn-delete" style="display: none;">Удалить</button>
    </div>
  </div>
</div>


<script>
  const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
  const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const studentId = urlParams.get('student_id');

  let currentUser = null;
  let currentRole = null;
  let student = null;
  let steps = [];
  let canEdit = false;
  let editingStep = null; // null = новая зона, иначе объект шага

  const ZONE_SIZE = 64;
  const TEST_SIZE = 92;
  const COLS = 5;
  const COL_GAP = 180;
  const ROW_GAP = 160;
  const OFFSET_X = 100;
  const OFFSET_Y = 80;

  // ---------- Утилиты ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- Инициализация ----------
  async function init() {
    if (!studentId) {
      document.getElementById('map-canvas').innerHTML =
        '<div class="loading" style="color:var(--danger);">Ошибка: не передан student_id.</div>';
      return;
    }

    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;

    const { data: profile } = await supabaseClient
      .from('profiles').select('role, full_name').eq('id', user.id).single();
    if (!profile) { window.location.href = 'login.html'; return; }
    currentRole = profile.role;

    // Загружаем ученика
    const { data: st, error: stErr } = await supabaseClient
      .from('students').select('*').eq('id', studentId).single();
    if (stErr || !st) {
      document.getElementById('map-canvas').innerHTML =
        '<div class="loading" style="color:var(--danger);">Ученик не найден.</div>';
      return;
    }
    student = st;

    // Права
    if (currentRole === 'admin') canEdit = true;
    else if (currentRole === 'teacher' && st.teacher_id === user.id) canEdit = true;
    else if (currentRole === 'student' && user.id === studentId) canEdit = false;
    else canEdit = false;

    // Шапка
    const fullName = [student.surname, student.name].filter(Boolean).join(' ') || 'Ученик';
    document.getElementById('student-name').textContent = fullName;

    // Кнопка «назад» по роли
    const backBtn = document.getElementById('back-btn');
    const logoLink = document.getElementById('logo-link');
    if (currentRole === 'admin' || currentRole === 'teacher') {
      backBtn.href = 'admin.html';
      backBtn.textContent = '← В админку';
      logoLink.href = 'admin.html';
    } else {
      backBtn.href = 'student.html';
      backBtn.textContent = '← В кабинет';
      logoLink.href = 'student.html';
    }

    // Кнопка добавления — только тем, кто может редактировать
    if (canEdit) {
      const addBtn = document.getElementById('add-btn');
      addBtn.style.display = 'inline-flex';
      addBtn.addEventListener('click', () => openModal(null));
    }

    await loadSteps();
    render();
  }

  async function loadSteps() {
    const { data, error } = await supabaseClient
      .from('iom_steps')
      .select('*')
      .eq('student_id', studentId)
      .order('step_number', { ascending: true });
    if (error) {
      console.error('Ошибка загрузки шагов:', error);
      steps = [];
    } else {
      steps = data || [];
    }
  }

  // ---------- Отрисовка ----------
  function calcPosition(index) {
    // Змейкой: чётные ряды — слева направо, нечётные — справа налево
    const row = Math.floor(index / COLS);
    const posInRow = index % COLS;
    const col = row % 2 === 0 ? posInRow : (COLS - 1 - posInRow);
    const x = OFFSET_X + col * COL_GAP;
    const y = OFFSET_Y + row * ROW_GAP;
    return { x, y, row };
  }

  function render() {
    const canvas = document.getElementById('map-canvas');
    const svg = document.getElementById('map-svg');
    const stats = document.getElementById('stats');

    if (steps.length === 0) {
      canvas.innerHTML = '<div class="loading">' +
        (canEdit ? 'Маршрут ещё не начат. Нажми «+ Добавить урок».' : 'Маршрут ещё не составлен.') +
        '</div>';
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      stats.style.display = 'none';
      canvas.style.minHeight = '400px';
      return;
    }

    // Вычисляем размер полотна (в пикселях, как у #map-canvas)
    const lastIdx = steps.length - 1;
    const lastPos = calcPosition(lastIdx);
    const width = Math.max(1000, OFFSET_X * 2 + (COLS - 1) * COL_GAP + TEST_SIZE);
    const height = Math.max(400, lastPos.y + TEST_SIZE + OFFSET_Y);
    // viewBox заставляет SVG-координаты совпадать с пикселями контейнера
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('preserveAspectRatio', 'xMinYMin meet');
    canvas.style.minHeight = height + 'px';
    canvas.style.width = width + 'px';


    // Дорожка (плавная линия через центры зон)
    let path = '';
    steps.forEach((step, i) => {
      const pos = calcPosition(i);
      // Небольшое смещение центра, чтобы крупные зоны смотрелись ровно
      const cx = pos.x;
      const cy = pos.y;
      if (i === 0) path += 'M ' + cx + ' ' + cy;
      else {
        const prev = calcPosition(i - 1);
        const midX = (prev.x + cx) / 2;
        path += ' C ' + midX + ' ' + prev.y + ', ' + midX + ' ' + cy + ', ' + cx + ' ' + cy;
      }
    });
    // Очищаем SVG (без innerHTML — он не работает для SVG в Safari)
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('fill', 'none');
    pathEl.setAttribute('stroke', 'rgba(197,240,90,0.85)');
    pathEl.setAttribute('stroke-width', '8');
    pathEl.setAttribute('stroke-linecap', 'round');
    pathEl.setAttribute('stroke-dasharray', '2 16');
    svg.appendChild(pathEl);

    // Зоны
    const zonesHtml = steps.map((step, i) => {
      const pos = calcPosition(i);
      const isTest = step.type === 'test';
      const size = isTest ? TEST_SIZE : ZONE_SIZE;
      const left = pos.x - size / 2;
      const top = pos.y - size / 2;
      const label = step.title || (isTest ? 'Контрольный срез' : 'Без названия');
      const sub = isTest && step.result ? step.result : '';
      const cls = isTest ? 'zone zone-test' : 'zone';
      const style = [
        'left:' + left + 'px',
        'top:' + top + 'px',
        'width:' + size + 'px',
        'height:' + size + 'px'
      ].join(';');
      const numBadge = '<span class="zone-num">' + (i + 1) + '</span>';
      const titleHtml = '<span class="zone-label">' + esc(label) + '</span>';
      const subHtml = sub ? '<span class="zone-sub">' + esc(sub) + '</span>' : '';
      return '<div class="' + cls + '" style="' + style + '" data-idx="' + i + '">' +
        numBadge +
        '<div class="zone-inner">' + titleHtml + subHtml + '</div>' +
      '</div>';
    }).join('');

    canvas.innerHTML = '<div class="zone-layer">' + zonesHtml + '</div>';

    // Клики по зонам
    canvas.querySelectorAll('.zone').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const step = steps[idx];
        if (canEdit) openModal(step);
        else openModalReadOnly(step);
      });
    });

    // Статистика
    const lessonsCount = steps.filter(s => s.type === 'lesson').length;
    const tests = steps.filter(s => s.type === 'test');
    const lastTest = tests.length > 0 ? tests[tests.length - 1] : null;
    document.getElementById('stat-lessons').textContent = lessonsCount;
    document.getElementById('stat-tests').textContent = tests.length;
    document.getElementById('stat-last').textContent = lastTest && lastTest.result ? lastTest.result : '—';
    stats.style.display = 'flex';
  }

  // ---------- Модалка ----------
  const modal = document.getElementById('zone-modal');
  const modalTitle = document.getElementById('zone-title');
  const modalHint = document.getElementById('zone-hint');
  const labelTitle = document.getElementById('label-title');
  const groupResult = document.getElementById('group-result');
  const inputTitle = document.getElementById('zone-input-title');
  const inputResult = document.getElementById('zone-input-result');
  const btnSave = document.getElementById('btn-save');
  const btnDelete = document.getElementById('btn-delete');

  function nextStepNumber() {
    if (steps.length === 0) return 1;
    return Math.max.apply(null, steps.map(s => s.step_number || 0)) + 1;
  }

  function openModal(step) {
    editingStep = step;
    modal.classList.add('active');

    if (step) {
      const isTest = step.type === 'test';
      modalTitle.textContent = isTest ? 'Контрольный срез' : 'Урок';
      modalHint.textContent = isTest
        ? 'После 7 уроков — подведи результат'
        : 'Тема урока';
      labelTitle.textContent = isTest ? 'Тема среза (необязательно)' : 'Тема урока';
      inputTitle.value = step.title || '';
      inputResult.value = step.result || '';
      groupResult.style.display = isTest ? 'block' : 'none';
      btnDelete.style.display = 'inline-block';
    } else {
      // Новая зона. Тип определяем по правилу: каждые 7 уроков — срез
      const next = nextStepNumber();
      const isTest = next % 7 === 0;
      modalTitle.textContent = isTest ? 'Контрольный срез' : 'Новый урок';
      modalHint.textContent = isTest
        ? 'Автоматически: каждый 7-й шаг — контрольный срез'
        : 'Тема урока';
      labelTitle.textContent = isTest ? 'Тема среза (необязательно)' : 'Тема урока';
      inputTitle.value = '';
      inputResult.value = '';
      groupResult.style.display = isTest ? 'block' : 'none';
      btnDelete.style.display = 'none';
    }

    setTimeout(() => inputTitle.focus(), 50);
  }

  function openModalReadOnly(step) {
    const isTest = step.type === 'test';
    modalTitle.textContent = isTest ? 'Контрольный срез' : 'Урок';
    modalHint.textContent = 'Просмотр';
    labelTitle.textContent = isTest ? 'Тема среза' : 'Тема урока';
    inputTitle.value = step.title || '';
    inputResult.value = step.result || '';
    inputTitle.disabled = true;
    inputResult.disabled = true;
    groupResult.style.display = isTest ? 'block' : 'none';
    btnSave.style.display = 'none';
    btnDelete.style.display = 'none';

    // Возвращаем редактируемость при следующем открытии в режиме редактирования
    modal.classList.add('active');
  }

  function closeModal() {
    modal.classList.remove('active');
    editingStep = null;
    inputTitle.disabled = false;
    inputResult.disabled = false;
    btnSave.style.display = 'inline-block';
  }

  document.getElementById('close-zone-modal').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  // Сохранить
  btnSave.addEventListener('click', async () => {
    const title = inputTitle.value.trim();
    const result = inputResult.value.trim();

    if (editingStep) {
      // Обновление
      const payload = { title: title, result: result };
      const { error } = await supabaseClient
        .from('iom_steps').update(payload).eq('id', editingStep.id);
      if (error) { alert('Ошибка сохранения: ' + error.message); return; }
    } else {
      // Создание
      const next = nextStepNumber();
      const isTest = next % 7 === 0;
      const payload = {
        student_id: studentId,
        step_number: next,
        type: isTest ? 'test' : 'lesson',
        title: title,
        result: isTest ? result : ''
      };
      const { error } = await supabaseClient.from('iom_steps').insert([payload]);
      if (error) { alert('Ошибка создания: ' + error.message); return; }
    }

    closeModal();
    await loadSteps();
    render();
  });

  // Удалить
  btnDelete.addEventListener('click', async () => {
    console.log('=== КЛИК УДАЛИТЬ ===');
    console.log('editingStep:', editingStep);
    if (!editingStep) {
        console.log('editingStep пустой!');
        return;
    }
    const confirmed = confirm('Удалить этот шаг маршрута?');
    console.log('Результат confirm:', confirmed);
    if (!confirmed) return;
    
    console.log('Отправляем DELETE для ID:', editingStep.id);
    const { data, error } = await supabaseClient
      .from('iom_steps').delete().eq('id', editingStep.id).select();
      
    console.log('Ответ от Supabase: data =', data, 'error =', error);
    if (error) { alert('Ошибка удаления: ' + error.message); return; }
    closeModal();
    await loadSteps();
    render();
  });

  init();
</script>

</body>
</html>
