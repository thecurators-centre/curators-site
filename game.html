<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Перерыв | The Curator’s</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #25283d;
            --card-bg: #313452;
            --accent-lime: #c5f05a;
            --accent-purple: #7455d9;
            --text-main: #f4f3ee;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid rgba(244, 243, 238, 0.1);
            z-index: 10;
        }

        .logo-container img { width: 150px; height: auto; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        
        .btn-back {
            color: var(--accent-lime);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--accent-lime);
            padding: 8px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--accent-lime); color: var(--bg-color); }

        .game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 2.5 / 1;
            background: var(--bg-color);
            border: 2px solid var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(37, 40, 61, 0.85);
            backdrop-filter: blur(5px);
            z-index: 20;
            transition: opacity 0.3s;
        }
        
        .ui-overlay.hidden { display: none; }

        .ui-overlay h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--accent-lime);
            margin-bottom: 10px;
            text-align: center;
        }
        .ui-overlay p {
            opacity: 0.8;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1rem;
        }

        .btn-start {
            background: var(--accent-lime);
            color: var(--bg-color);
            border: none;
            padding: 15px 40px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(197, 240, 90, 0.2);
        }
        .btn-start:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(197, 240, 90, 0.4); }

        .score-display {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-lime);
            z-index: 10;
            font-family: monospace;
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.5;
            text-align: center;
        }
        .controls-hint span {
            display: inline-block;
            padding: 2px 8px;
            background: var(--card-bg);
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 0 5px;
        }

        @media (max-width: 768px) {
            .game-container { aspect-ratio: 1.5 / 1; }
            header { flex-direction: column; gap: 10px; padding-top: calc(10px + env(safe-area-inset-top)); }
        }
    </style>
</head>
<body>

    <header>
        <a href="student.html" class="logo-container" id="backLogo"><img src="logo.png" alt="Logo"></a>
        <div class="header-right">
            <a href="student.html" class="btn-back" id="backBtn">← Назад в кабинет</a>
        </div>
    </header>

    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <div class="score-display" id="scoreDisplay">00000</div>
            
            <canvas id="gameCanvas"></canvas>
            
            <div class="ui-overlay" id="startScreen">
                <h1>Перерыв</h1>
                <p>Помоги динозаврику пробежать как можно дальше, уворачиваясь от книг!</p>
                <button class="btn-start" id="startBtn">Погнали!</button>
            </div>

            <div class="ui-overlay hidden" id="gameOverScreen">
                <h1>Игра окончена</h1>
                <p>Твой результат: <strong id="finalScore">0</strong></p>
                <button class="btn-start" id="restartBtn">Ещё раз</button>
            </div>
        </div>
        
        <div class="controls-hint">
            Управление: <span>Пробел</span> или <span>Клик / Тап</span> по экрану
        </div>
    </div>

    <script>
        // Настраиваем кнопку "Назад" в зависимости от роли пользователя
        const role = localStorage.getItem('user_role');
        if (role === 'admin' || role === 'teacher') {
            document.getElementById('backLogo').href = 'admin.html';
            document.getElementById('backBtn').href = 'admin.html';
            document.getElementById('backBtn').innerText = '← Назад в админку';
        }
    </script>


    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        
        let gameLoop;
        let isPlaying = false;
        let score = 0;
        let speed = 6;
        
        // Цвета
        const COLOR_LIME = '#c5f05a';
        const COLOR_PURPLE = '#7455d9';
        const COLOR_BG = '#25283d';

        // Игрок
        const dino = {
            x: 50,
            y: 0,
            width: 40,
            height: 50,
            vy: 0,
            gravity: 0.6,
            jumpPower: -12,
            isJumping: false,
            color: COLOR_LIME
        };

        let books = [];
        let distanceSinceLastBook = 0; // дистанция с момента последнего спавна

        // Адаптация под размер экрана
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            // Приземляем динозавра на землю
            dino.y = canvas.height - dino.height - 20;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawDino() {
            ctx.fillStyle = dino.color;
            const x = dino.x;
            const y = dino.y;
            const w = dino.width;
            const h = dino.height;

            // 1. Хвост (сзади)
            ctx.fillRect(x - 10, y + h - 20, 15, 12);
            ctx.fillRect(x - 18, y + h - 16, 10, 8);

            // 2. Тело
            ctx.fillRect(x, y, w, h);

            // 3. Шея и голова (вытянуты вперед и вверх)
            // Шея
            ctx.fillRect(x + w - 10, y - 10, 10, 20);
            // Голова
            ctx.fillRect(x + w, y - 18, 22, 18);
            // Пасть (вырез)
            ctx.fillStyle = COLOR_BG;
            ctx.fillRect(x + w + 8, y - 6, 14, 4);
            // Глаз
            ctx.fillRect(x + w + 12, y - 14, 4, 4);
            
            // Возвращаем цвет
            ctx.fillStyle = dino.color;

            // 4. Лапы (анимация)
            let legOffset = isPlaying ? (Math.floor(Date.now() / 100) % 2 === 0 ? 0 : 8) : 0;
            // Задняя лапа
            ctx.fillRect(x + 2, y + h, 8, 12 - legOffset);
            ctx.fillRect(x + 2, y + h + 12 - legOffset, 10, 4); // стопа
            // Передняя лапа
            ctx.fillRect(x + 22, y + h, 8, 4 + legOffset);
            ctx.fillRect(x + 22, y + h + 4 + legOffset, 10, 4); // стопа
            
            // Маленькая ручка (для узнаваемости)
            ctx.fillRect(x + w - 8, y + 10, 6, 4);
        }

        function drawBook(book) {
            // Чередуем цвета для разнообразия
            const isAlt = (book.x % 2 === 0); 
            ctx.fillStyle = isAlt ? COLOR_PURPLE : '#8c6df0'; // фиолетовый и светло-фиолетовый
            // Обложка книги
            ctx.fillRect(book.x, book.y, book.width, book.height);
            // Корешок
            ctx.fillStyle = COLOR_LIME;
            ctx.fillRect(book.x, book.y, 4, book.height);
            // Страницы
            ctx.fillStyle = '#f4f3ee';
            ctx.fillRect(book.x + book.width - 4, book.y + 2, 2, book.height - 4);
            // Полоска на обложке для "корешка"
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(book.x + 8, book.y + 5, 2, book.height - 10);
        }

        function drawGround() {
            ctx.strokeStyle = COLOR_PURPLE;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 20);
            ctx.lineTo(canvas.width, canvas.height - 20);
            ctx.stroke();
            
            // Декоративные точки на земле
            ctx.fillStyle = 'rgba(116, 85, 217, 0.3)';
            let offset = (Date.now() / 20) % 40;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillRect(i - offset, canvas.height - 15, 10, 2);
            }
        }

        function update() {
            if (!isPlaying) return;

            // Прыжок
            if (dino.isJumping) {
                dino.y += dino.vy;
                dino.vy += dino.gravity;
                if (dino.y >= canvas.height - dino.height - 20) {
                    dino.y = canvas.height - dino.height - 20;
                    dino.isJumping = false;
                    dino.vy = 0;
                }
            }

            // --- НОВАЯ ЛОГИКА СПАВНА (по дистанции) ---
            distanceSinceLastBook += speed;

            // Минимальный зазор зависит от текущей скорости и ширины книги
            // Базовая ширина книги 25. Зазор = (ширина * 3) + скорость*20 + рандом
            const baseGap = 25 * 3; 
            const speedFactor = speed * 20;
            const randomExtra = Math.random() * 150;
            const requiredGap = baseGap + speedFactor + randomExtra;

            if (distanceSinceLastBook > requiredGap) {
                distanceSinceLastBook = 0;

                // Решаем, сколько книг спавнить (1, 2 или 3) с вероятностями
                let count = 1;
                const rand = Math.random();
                if (rand > 0.7) count = 2;
                if (rand > 0.9) count = 3;

                // Спавним пачку книг
                let startX = canvas.width;
                for (let i = 0; i < count; i++) {
                    // Высота книги от 30 до 60
                    let bookHeight = 30 + Math.random() * 30;
                    // Ширина книги
                    let bookWidth = 25; 
                    
                    books.push({
                        x: startX + (i * (bookWidth + 5)), // небольшая щель между книгами
                        y: canvas.height - 20 - bookHeight,
                        width: bookWidth,
                        height: bookHeight
                    });
                }

                // Постепенное усложнение (скорость растет)
                if (speed < 15) speed += 0.05;
            }

            // Движение и столкновения
            for (let i = books.length - 1; i >= 0; i--) {
                let b = books[i];
                b.x -= speed;

                // Хитбокс динозавра (немного уменьшен для честности)
                const dinoHitbox = { x: dino.x + 5, y: dino.y + 5, w: dino.width - 10, h: dino.height - 5 };
                const bookHitbox = { x: b.x, y: b.y, w: b.width, h: b.height };

                // Проверка коллизии
                if (dinoHitbox.x < bookHitbox.x + bookHitbox.w &&
                    dinoHitbox.x + dinoHitbox.w > bookHitbox.x &&
                    dinoHitbox.y < bookHitbox.y + bookHitbox.h &&
                    dinoHitbox.y + dinoHitbox.h > bookHitbox.y) {
                    gameOver();
                    return;
                }

                // Удаляем уехавшие книги
                if (b.x + b.width < 0) books.splice(i, 1);
            }

            // Счет
            score += 0.1;
            scoreDisplay.innerText = Math.floor(score).toString().padStart(5, '0');
        }

        function draw() {
            // Очистка
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawGround();
            drawDino();
            books.forEach(drawBook);
        }

        function loop() {
            update();
            draw();
            gameLoop = requestAnimationFrame(loop);
        }

        function startGame() {
            isPlaying = true;
            score = 0;
            speed = 6;
            spawnInterval = 90;
            books = [];
            distanceSinceLastBook = 0;
            dino.y = canvas.height - dino.height - 20;
            dino.isJumping = false;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.style.display = 'block';
            
            if (gameLoop) cancelAnimationFrame(gameLoop);
            loop();
        }

        function gameOver() {
            isPlaying = false;
            finalScoreEl.innerText = Math.floor(score);
            gameOverScreen.classList.remove('hidden');
        }

        function jump() {
            if (!isPlaying) return;
            if (!dino.isJumping) {
                dino.isJumping = true;
                dino.vy = dino.jumpPower;
            }
        }

        // Обработчики
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        container.addEventListener('mousedown', jump);
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        }, { passive: false });

        // Инициализация отрисовки до старта (чтобы был виден динозавр)
        resizeCanvas();
        draw();
    </script>

</body>
</html>
