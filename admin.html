<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка | The Curator’s</title>
    <style>
        body { font-family: sans-serif; background: #25283d; color: #f4f3ee; padding: 20px; }
        h1 { color: #c5f05a; }
        .card { background: #313452; padding: 20px; margin: 10px 0; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Админ-панель (Тест)</h1>
    <div id="list"></div>
    <script>
        var students = [{name: "Иванов Петр", subject: "Физика"}];
        var html = '';
        for (var i = 0; i < students.length; i++) {
            html += '<div class="card"><b>' + students[i].name + '</b> - ' + students[i].subject + '</div>';
        }
        document.getElementById('list').innerHTML = html;
    </script>
</body>
</html>
