<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | The Curator’s</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js" defer></script>
    <style>
        /* Дополнительные стили для календаря, чтобы не раздувать admin.css */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; background: var(--card-bg); padding: 20px; border-radius: 20px; }
        .cal-header { font-weight: bold; text-align: center; font-size: 0.8rem; opacity: 0.5; padding-bottom: 10px; }
        .cal-day { background: var(--bg-color); border-radius: 12px; min-height: 90px; padding: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; position: relative; }
        .cal-day:hover { border-color: var(--accent-lime); }
        .cal-day.today { border: 2px solid var(--accent-purple); }
        .cal-num { font-weight: bold; margin-bottom: 5px; }
        .cal-event { font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; margin-bottom: 3px; color: var(--bg-color); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Модалка календаря */
        #calModal .modal-content { max-width: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="flex-direction: column; align-items: flex-start; gap: 15px; padding-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <span id="user-info" style="font-size: 1rem; font-weight: 600; color: var(--accent-lime);">Загрузка...</span>
                <div class="header-right">
                    <a href="game.html" class="btn-header-link" style="text-decoration:none; padding:8px 15px; border-radius:10px; font-weight:bold; background:#f4f3ee; color:var(--bg-color); margin-right:10px;">Играть</a>
                    <a href="materials.html" class="btn-header-link btn-purple" style="text-decoration:none; padding:8px 15px; border-radius:10px; font-weight:bold;">Библиотека</a>
                    <a href="chat.html" class="btn-header-link btn-lime" style="text-decoration:none; padding:8px 15px; border-radius:10px; font-weight:bold; margin: 0 10px;">Мессенджер</a>
                    <a href="#" onclick="supabaseClient.auth.signOut().then(() => window.location.href = 'login.html')" style="color: var(--text-main); text-decoration: none;">Выйти</a>
                </div>
            </div>
            <div class="header-tabs" style="width: 100%; display:flex; gap:10px;">
                <h1 id="tab-students" class="active" onclick="switchTab('students')">Ученики</h1>
                <h1 id="tab-boards" onclick="switchTab('boards')">Доски</h1>
                <h1 id="tab-schedule" onclick="switchTab('schedule')">Расписание</h1>
                <h1 id="tab-teachers" onclick="switchTab('teachers')" style="display: none;">Учителя</h1>
            </div>
        </header>
        
        <!-- Вкладка Ученики -->
        <div id="section-students">
            <div style="display:flex; flex-wrap:wrap; gap:15px; align-items:center; margin-bottom:20px;">
                <button class="btn" id="addBtn" style="margin-bottom:0;">+ Добавить ученика</button>
                <select id="filter-teacher" style="display:none; padding:10px 15px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:var(--card-bg); color:var(--text-main); font-family:inherit; font-size:0.95rem; cursor:pointer; min-width:220px;">
                    <option value="">Все учителя</option>
                </select>
            </div>
            <div class="grid" id="grid"><div class="loading">Загрузка...</div></div>
        </div>

        <!-- Вкладка Доски -->
        <div id="section-boards" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="font-size: 1.5rem; margin: 0;">Мои доски</h2>
                <button class="btn" id="addBoardBtn" style="margin-bottom: 0;">+ Создать доску</button>
            </div>
            <div class="grid" id="boards-grid"></div>
        </div>

        <!-- Вкладка Расписание -->
        <div id="section-schedule" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="cal-month-title" style="font-size: 1.5rem; margin: 0;">Месяц</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" id="cal-prev" style="margin: 0; padding: 8px 15px;">←</button>
                    <button class="btn" id="cal-next" style="margin: 0; padding: 8px 15px;">→</button>
                </div>
            </div>
            <div class="cal-grid" id="calendar-grid"></div>
        </div>

        <!-- Вкладка Учителя -->
        <div id="section-teachers" style="display: none;">
            <button class="btn" id="addTeacherBtn">+ Добавить учителя</button>
            <div class="grid" id="teachers-grid"><div class="loading">Загрузка...</div></div>
        </div>
    </div>

    <!-- Модалка ученика -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 style="margin-bottom: 20px;">Карточка ученика</h2>
            <form id="form">
                <input type="hidden" id="id">
                <div class="form-row">
                    <div class="form-group"><label>Логин</label><input type="text" id="login" required></div>
                    <div class="form-group"><label>Пароль (мин. 6 символов)</label><input type="text" id="password" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Фамилия</label><input type="text" id="surname" required></div>
                    <div class="form-group"><label>Имя</label><input type="text" id="name" required></div>
                </div>
                <div class="form-group"><label>Отчество</label><input type="text" id="patronymic"></div>
                <div class="form-row">
                    <div class="form-group"><label>Возраст</label><input type="number" id="age"></div>
                    <div class="form-group"><label>Класс</label><input type="text" id="grade"></div>
                </div>
                <div class="form-group">
                    <label>Предметы</label>
                    <select id="subjects" multiple size="4">
                        <option value="Русский язык">Русский язык</option>
                        <option value="Японский язык">Японский язык</option>
                        <option value="Английский язык">Английский язык</option>
                        <option value="Литература">Литература</option>
                        <option value="Обществознание">Обществознание</option>
                        <option value="История">История</option>
                        <option value="Физика">Физика</option>
                        <option value="Подготовка к школе">Подготовка к школе</option>
                        <option value="Нач. русский">Нач. русский</option>
                        <option value="Нач. математика">Нач. математика</option>
                        <option value="Нач. окружающий мир">Нач. окружающий мир</option>
                        <option value="Нач. чтение">Нач. чтение</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Уровень (1-5)</label>
                    <input type="range" id="level" min="1" max="5" value="3" oninput="document.getElementById('levelVal').innerText = this.value">
                    <span id="levelVal" style="color: var(--accent-lime); font-weight: bold;">3</span>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Стоимость часа (руб.)</label><input type="number" id="hourly_rate"></div>
                </div>
                <div class="form-group"><label>Об ученике</label><textarea id="about_student"></textarea></div>
                <hr style="border-color: #444; margin: 20px 0;">
                <div class="form-group"><label>Пройденные темы</label><textarea id="topics"></textarea></div>
                <div class="form-group" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <label>Расписание занятий</label>
                    <div class="form-row" style="margin-bottom: 10px;">
                        <div class="form-group" style="margin:0; flex: 1;">
                            <select id="schedule_month">
                                <option value="">Месяц</option>
                                <option value="1">Январь</option>
                                <option value="2">Февраль</option>
                                <option value="3">Март</option>
                                <option value="4">Апрель</option>
                                <option value="5">Май</option>
                                <option value="6">Июнь</option>
                                <option value="7">Июль</option>
                                <option value="8">Август</option>
                                <option value="9">Сентябрь</option>
                                <option value="10">Октябрь</option>
                                <option value="11">Ноябрь</option>
                                <option value="12">Декабрь</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin:0; flex: 1;">
                            <input type="number" id="schedule_year" placeholder="Год" min="2024" max="2100">
                        </div>
                    </div>
                    <div id="student-calendar" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: var(--bg-color); padding: 10px; border-radius: 12px;">
                        <!-- Сюда JS вставит дни -->
                    </div>
                    <input type="hidden" id="schedule_days">
                </div>
                <a href="#" id="iomLink" class="btn-notebook" style="display: none; margin-top:10px; text-align:center; text-decoration:none; color:white; background:var(--accent-lime); padding:15px; border-radius:8px; font-weight:bold; align-items:center; justify-content:center; gap:8px;">
    <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M9 4L3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/></svg>
    Открыть карту ИОМ
</a>
<button type="button" id="reportBtn" style="display: none; width: 100%; margin-top:10px; padding:15px; border-radius:8px; border:none; font-weight:bold; color:white; background:var(--accent-purple); cursor:pointer; font-family:inherit; font-size:1rem; align-items:center; justify-content:center; gap:8px;">
    <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Отчет по срезам
</button>

<!-- Модалка отчета -->
<div class="modal" id="reportModal" style="z-index: 2000;">
    <div class="modal-content" style="max-width: 600px;">
        <button class="close-btn" id="closeReportModal">&times;</button>
        <h2 style="margin-bottom: 20px;">Отчет по срезам</h2>
        <div id="reportContent" style="display: flex; flex-direction: column; gap: 15px;"></div>
    </div>
</div>
                <button type="submit" class="btn-save">Сохранить</button>
                <a href="#" id="notebookLink" class="btn-notebook" style="display: none; margin-top:10px; text-align:center; text-decoration:none; color:white; background:var(--accent-purple); padding:15px; border-radius:8px; align-items:center; justify-content:center; gap:8px;">
    <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/><line x1="8" y1="2" x2="8" y2="22"/><line x1="12" y1="7" x2="16" y2="7"/><line x1="12" y1="11" x2="16" y2="11"/></svg>
    Открыть тетрадь
</a>
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none; background: var(--danger); color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer;">Удалить</button>
            </form>
        </div>
    </div>

    <!-- Модалка создания доски -->
    <div class="modal" id="boardModal">
        <div class="modal-content" style="max-width: 400px;">
            <button class="close-btn" id="closeBoardModal">&times;</button>
            <h2 style="margin-bottom: 20px;">Новая доска</h2>
            <form id="boardForm">
                <div class="form-group"><label>Название</label><input type="text" id="board_title" placeholder="Например: Миша - Физика" required></div>
                <div class="form-group">
                    <label>Предмет (влияет на цвет)</label>
                    <select id="board_subject" required>
                        <option value="Русский язык">Русский язык</option>
                        <option value="Японский язык">Японский язык</option>
                        <option value="Английский язык">Английский язык</option>
                        <option value="Литература">Литература</option>
                        <option value="Обществознание">Обществознание</option>
                        <option value="История">История</option>
                        <option value="Физика">Физика</option>
                        <option value="Подготовка к школе">Подготовка к школе</option>
                        <option value="Нач. русский">Нач. русский</option>
                        <option value="Нач. математика">Нач. математика</option>
                        <option value="Нач. окружающий мир">Нач. окружающий мир</option>
                        <option value="Нач. чтение">Нач. чтение</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Создать</button>
            </form>
        </div>
    </div>

    <!-- Модалка календаря -->
    <div class="modal" id="calModal">
        <div class="modal-content" style="max-width: 450px;">
            <button class="close-btn" id="closeCalModal">&times;</button>
            <h2 style="margin-bottom: 10px;" id="cal-modal-title">Запись</h2>
            
            <!-- Список существующих записей на этот день -->
            <div id="cal-events-list" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto;">
                <!-- Сюда JS вставит записи -->
            </div>

            <hr style="border-color: #444; margin: 20px 0;">
            <h3 style="margin-bottom: 15px; font-size: 1rem; color: var(--accent-lime);">Добавить запись</h3>
            
            <form id="calForm">
                <input type="hidden" id="cal_date">
                <div class="form-group"><label>Ученик</label><input type="text" id="cal_student" placeholder="Имя" required></div>
                <div class="form-group">
                    <label>Предмет</label>
                    <select id="cal_subject" required>
                        <option value="Русский язык">Русский язык</option>
                        <option value="Японский язык">Японский язык</option>
                        <option value="Английский язык">Английский язык</option>
                        <option value="Литература">Литература</option>
                        <option value="Обществознание">Обществознание</option>
                        <option value="История">История</option>
                        <option value="Физика">Физика</option>
                        <option value="Подготовка к школе">Подготовка к школе</option>
                        <option value="Нач. русский">Нач. русский</option>
                        <option value="Нач. математика">Нач. математика</option>
                        <option value="Нач. окружающий мир">Нач. окружающий мир</option>
                        <option value="Нач. чтение">Нач. чтение</option>
                    </select>
                </div>
                <div class="form-group"><label>Время</label><input type="text" id="cal_time" placeholder="15:00"></div>
                <div class="form-group"><label>Заметка (до 20 символов)</label><input type="text" id="cal_note" maxlength="20"></div>
                <button type="submit" class="btn-save">Добавить</button>
            </form>
        </div>
    </div>

    <!-- Модалка учителя -->
    <div class="modal" id="teacherModal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-btn" id="closeTeacherModal">&times;</button>
            <h2 style="margin-bottom: 20px;">Карточка учителя</h2>
            <form id="teacherForm">
                <input type="hidden" id="teacher_id">
                <div class="form-row">
                    <div class="form-group"><label>Фамилия</label><input type="text" id="teacher_surname" required></div>
                    <div class="form-group"><label>Имя</label><input type="text" id="teacher_name" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Email (логин)</label><input type="email" id="teacher_email" required></div>
                    <div class="form-group"><label>Пароль</label><input type="text" id="teacher_password"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Ставка (%)</label><input type="number" id="teacher_rate"></div>
                    <div class="form-group"><label>Телефон</label><input type="tel" id="teacher_phone"></div>
                </div>
                <div class="form-group">
                    <label>Предметы</label>
                    <select id="teacher_subjects" multiple size="4">
                        <option value="Русский язык">Русский язык</option>
                        <option value="Японский язык">Японский язык</option>
                        <option value="Английский язык">Английский язык</option>
                        <option value="Литература">Литература</option>
                        <option value="Обществознание">Обществознание</option>
                        <option value="История">История</option>
                        <option value="Физика">Физика</option>
                        <option value="Подготовка к школе">Подготовка к школе</option>
                        <option value="Нач. русский">Нач. русский</option>
                        <option value="Нач. математика">Нач. математика</option>
                        <option value="Нач. окружающий мир">Нач. окружающий мир</option>
                        <option value="Нач. чтение">Нач. чтение</option>
                    </select>
                </div>
                <button type="submit" class="btn-save" id="teacherSaveBtn">Сохранить</button>
            </form>
        </div>
    </div>
</body>
</html>
