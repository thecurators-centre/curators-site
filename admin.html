<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | The Curator’s</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #25283d; --text-main: #f4f3ee; --accent-lime: #c5f05a; --card-bg: #313452; --danger: #ff6b6b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: var(--accent-lime); margin-bottom: 20px; }
        .btn { background: var(--accent-lime); color: var(--bg-color); border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        
        /* Базовый стиль карточки */
        .card { 
            padding: 20px; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); filter: brightness(1.1); }
        .card h3 { margin-bottom: 5px; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .card p { color: rgba(255,255,255,0.8); font-size: 0.9rem; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        /* Цвета для предметов */
        .card[data-subject="Русский язык"] { background: linear-gradient(135deg, #7f1d1d, #ef4444); } /* Алый */
        .card[data-subject="Японский язык"] { background: linear-gradient(135deg, #94a3b8, #f1f5f9); color: #25283d; } /* Белый (сделаем чуть темнее для читаемости) */
        .card[data-subject="Японский язык"] h3, .card[data-subject="Японский язык"] p { color: #1e293b; text-shadow: none; }
        .card[data-subject="Литература"] { background: linear-gradient(135deg, #78350f, #d97706); } /* Бежевый/Золотистый */
        .card[data-subject="Физика"] { background: linear-gradient(135deg, #0f766e, #2dd4bf); } /* Бирюзовый */
        .card[data-subject="Обществознание"] { background: linear-gradient(135deg, #312e81, #4f46e5); } /* Индиго */
        .card[data-subject="История"] { background: linear-gradient(135deg, #3f6212, #84cc16); } /* Хаки */
        .card[data-subject="Английский язык"] { background: linear-gradient(135deg, #0369a1, #0ea5e9); } /* Небесно-голубой */
        .card[data-subject="Подготовка к школе"] { background: linear-gradient(135deg, #9d174d, #ec4899); } /* Розовый */
        .card[data-subject="Вся школьная программа"] { background: linear-gradient(135deg, #334155, #64748b); } /* Серый */
        .card[data-subject=""] { background: var(--card-bg); } /* По умолчанию */

        .loading { text-align: center; padding: 50px; font-size: 1.2rem; opacity: 0.5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-color); padding: 30px; border-radius: 20px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #555; background: var(--card-bg); color: white; font-family: inherit; }
        .form-group textarea { min-height: 70px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }
        .btn-save { width: 100%; padding: 12px; background: var(--accent-lime); color: var(--bg-color); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Ученики</h1>
            <a href="login.html" style="color: #f4f3ee; text-decoration: none;">Выйти</a>
        </div>
        <button class="btn" id="addBtn">+ Добавить ученика</button>
        <div class="grid" id="grid"><div class="loading">Загрузка...</div></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 style="margin-bottom: 20px;">Карточка ученика</h2>
            <form id="form">
                <input type="hidden" id="id">
                <div class="form-row">
                    <div class="form-group"><label>Логин</label><input type="text" id="login" required></div>
                    <div class="form-group"><label>Пароль</label><input type="text" id="password" required></div>
                </div>
                <hr style="border-color: #444; margin: 15px 0;">
                <div class="form-row">
                    <div class="form-group"><label>Фамилия</label><input type="text" id="surname" required></div>
                    <div class="form-group"><label>Имя</label><input type="text" id="name" required></div>
                </div>
                <div class="form-group"><label>Отчество</label><input type="text" id="patronymic"></div>
                <div class="form-row">
                    <div class="form-group"><label>Возраст</label><input type="number" id="age"></div>
                    <div class="form-group"><label>Класс</label><input type="text" id="grade"></div>
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <select id="subject">
                        <option value="Русский язык">Русский язык</option>
                        <option value="Японский язык">Японский язык</option>
                        <option value="Английский язык">Английский язык</option>
                        <option value="Литература">Литература</option>
                        <option value="Обществознание">Обществознание</option>
                        <option value="История">История</option>
                        <option value="Физика">Физика</option>
                        <option value="Подготовка к школе">Подготовка к школе</option>
                        <option value="Вся школьная программа">Вся школьная программа</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Уровень знаний (1-5)</label>
                    <input type="range" id="level" min="1" max="5" value="3" oninput="document.getElementById('levelVal').innerText = this.value">
                    <span id="levelVal" style="color: var(--accent-lime); font-weight: bold;">3</span>
                </div>
                
                <div class="form-group"><label>Домашняя работа</label><textarea id="homework" placeholder="Что задано..."></textarea></div>
                <div class="form-group"><label>Результаты тестирований</label><textarea id="tests" placeholder="Баллы, оценки..."></textarea></div>
                <div class="form-group"><label>Расписание</label><textarea id="schedule" placeholder="Пн 15:00, Ср 16:00..."></textarea></div>
                <div class="form-group"><label>Пройденные темы</label><textarea id="topics"></textarea></div>
                <div class="form-group"><label>ИОМ</label><textarea id="iom"></textarea></div>
                
                <button type="submit" class="btn-save">Сохранить</button>
                <button type="button" class="btn-delete" id="deleteBtn" style="display: none;">Удалить</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let students = [];
        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const form = document.getElementById('form');

        async function loadStudents() {
            grid.innerHTML = '<div class="loading">Загрузка...</div>';
            const { data, error } = await supabaseClient.from('students').select('*').order('id', { ascending: true });
            if (error) { grid.innerHTML = '<div class="loading" style="color: red;">Ошибка базы</div>'; return; }
            students = data || [];
            render();
        }

        function render() {
            grid.innerHTML = '';
            if (students.length === 0) { grid.innerHTML = '<p style="opacity:0.5;">Пусто</p>'; return; }
            students.forEach((s) => {
                const card = document.createElement('div');
                card.className = 'card';
                // Устанавливаем атрибут с названием предмета для CSS-стилей
                card.setAttribute('data-subject', s.subject || '');
                
                card.innerHTML = `<h3>${s.surname} ${s.name}</h3><p>Логин: ${s.login || 'не задан'}</p>`;
                card.onclick = () => openModal(s);
                grid.appendChild(card);
            });
        }

        function openModal(s = null) {
            form.reset();
            if (s) {
                document.getElementById('id').value = s.id;
                document.getElementById('login').value = s.login || '';
                document.getElementById('password').value = s.password || '';
                document.getElementById('surname').value = s.surname || '';
                document.getElementById('name').value = s.name || '';
                document.getElementById('patronymic').value = s.patronymic || '';
                document.getElementById('age').value = s.age || '';
                document.getElementById('grade').value = s.grade || '';
                document.getElementById('subject').value = s.subject || 'Русский язык';
                document.getElementById('level').value = s.level || 3;
                document.getElementById('levelVal').innerText = s.level || 3;
                document.getElementById('homework').value = s.homework || '';
                document.getElementById('tests').value = s.tests || '';
                document.getElementById('schedule').value = s.schedule || '';
                document.getElementById('topics').value = s.topics || '';
                document.getElementById('iom').value = s.iom || '';
                document.getElementById('deleteBtn').style.display = 'block';
            } else {
                document.getElementById('id').value = '';
                document.getElementById('level').value = 3;
                document.getElementById('levelVal').innerText = '3';
                document.getElementById('deleteBtn').style.display = 'none';
            }
            modal.classList.add('active');
        }

        document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const data = {
                login: document.getElementById('login').value.trim(),
                password: document.getElementById('password').value.trim(),
                surname: document.getElementById('surname').value,
                name: document.getElementById('name').value,
                patronymic: document.getElementById('patronymic').value,
                age: parseInt(document.getElementById('age').value) || null,
                grade: document.getElementById('grade').value,
                subject: document.getElementById('subject').value,
                level: parseInt(document.getElementById('level').value),
                homework: document.getElementById('homework').value,
                tests: document.getElementById('tests').value,
                schedule: document.getElementById('schedule').value,
                topics: document.getElementById('topics').value,
                iom: document.getElementById('iom').value
            };

            let error;
            if (id) {
                const res = await supabaseClient.from('students').update(data).eq('id', id);
                error = res.error;
            } else {
                const res = await supabaseClient.from('students').insert([data]);
                error = res.error;
            }

            if (error) alert('Ошибка: ' + error.message);
            else { modal.classList.remove('active'); loadStudents(); }
        };

        document.getElementById('deleteBtn').onclick = async () => {
            const id = document.getElementById('id').value;
            if (confirm('Удалить?')) {
                const { error } = await supabaseClient.from('students').delete().eq('id', id);
                if (error) alert('Ошибка: ' + error.message);
                else { modal.classList.remove('active'); loadStudents(); }
            }
        };

        document.getElementById('addBtn').onclick = () => openModal();
        loadStudents();
    </script>
</body>
</html>
