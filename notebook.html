<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тетрадь | The Curator’s</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #25283d; --card-bg: #313452; --accent-lime: #c5f05a; --text-main: #f4f3ee; --accent-purple: #7455d9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border-bottom: 1px solid rgba(244, 243, 238, 0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-container img { width: 150px; height: auto; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .header-right span { font-size: 0.9rem; opacity: 0.7; }
        .btn-logout { color: var(--accent-lime); text-decoration: none; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--accent-lime); padding: 8px 15px; border-radius: 10px; transition: 0.3s; cursor: pointer; background: none; }
        .btn-logout:hover { background: var(--accent-lime); color: var(--bg-color); }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .notebook-container {
            width: 100%; max-width: 800px; background: #fff; border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative;
            display: flex; flex-direction: column; overflow: hidden;
            margin-bottom: 100px;
        }
        
        .page-content {
            padding: 40px; min-height: 60vh; position: relative;
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 30px; line-height: 30px;
        }

        .page-text {
            width: 100%; border: none; background: transparent; outline: none;
            font-family: 'Inter', sans-serif; font-size: 1.1rem; line-height: 30px;
            resize: none; color: #333; position: relative; z-index: 2;
            min-height: 60vh;
        }

        .page-images {
            display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; position: relative; z-index: 2;
        }

        .image-preview {
            max-width: 100%; border-radius: 8px; border: 1px solid #ddd;
        }

        .pagination {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg); padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 15px; align-items: center; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .page-btn {
            background: var(--accent-lime); color: var(--bg-color); border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;
            font-size: 1rem; transition: 0.3s;
        }
        .page-btn:hover { transform: scale(1.05); }
        .page-btn:disabled { background: #555; cursor: not-allowed; transform: none; }
        .page-info { font-weight: bold; font-size: 1.1rem; }

        .admin-toolbar {
            position: fixed; top: 80px; right: 20px; background: var(--card-bg);
            padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px;
            z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-tool {
            background: var(--accent-lime); color: var(--bg-color); border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
        }
        .btn-tool:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(197, 240, 90, 0.3); }
        .btn-tool input[type="file"] { display: none; }

        .status {
            position: fixed; top: 80px; left: 20px; background: var(--card-bg);
            padding: 10px 20px; border-radius: 10px; font-size: 0.9rem;
            opacity: 0; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .status.show { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <a href="admin.html" class="logo-container"><img src="logo.png" alt="Logo"></a>
        <div class="header-right">
            <span id="header-name">Загрузка...</span>
            <a href="admin.html" class="btn-logout" id="backBtn">Выйти</a>
        </div>
    </header>

    <div class="main-content">
        <div class="notebook-container">
            <div class="page-content" id="pageContent"></div>
        </div>
    </div>

    <div class="pagination">
        <button class="page-btn" id="prevBtn">← Назад</button>
        <span class="page-info" id="pageInfo">Страница 1 из 100</span>
        <button class="page-btn" id="nextBtn">Вперед →</button>
    </div>

    <div id="status" class="status">Сохранено</div>

    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student_id');
        const isStudent = urlParams.get('role') === 'student';
        const studentName = urlParams.get('name') || 'Ученик';

        document.getElementById('header-name').innerText = `Тетрадь: ${studentName}`;
        if (isStudent) {
            document.getElementById('backBtn').href = 'student.html';
            document.getElementById('backBtn').innerText = 'Вернуться в кабинет';
        }

        let currentPage = 1;
        const TOTAL_PAGES = 100;
        let notebookData = {};

        const pageContent = document.getElementById('pageContent');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const statusEl = document.getElementById('status');

        async function loadNotebook() {
            const { data, error } = await supabaseClient.from('homework').select('*').eq('student_id', studentId).single();
            
            if (error && error.code !== 'PGRST116') console.error('Ошибка загрузки:', error);
            
            if (data && data.pages) notebookData = data.pages;
            else notebookData = {};
            
            renderPage();
            setupAdminUI();
        }

        function renderPage() {
            const pageKey = String(currentPage);
            const page = notebookData[pageKey] || { text: '', images: [] };

            pageContent.innerHTML = '';

            if (isStudent) {
                const textDiv = document.createElement('div');
                textDiv.className = 'page-text';
                textDiv.style.minHeight = 'auto';
                textDiv.style.whiteSpace = 'pre-wrap';
                textDiv.innerText = page.text || 'Страница пуста...';
                pageContent.appendChild(textDiv);

                if (page.images && page.images.length > 0) {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = 'page-images';
                    page.images.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.className = 'image-preview';
                        imgContainer.appendChild(img);
                    });
                    pageContent.appendChild(imgContainer);
                }
            } else {
                const textarea = document.createElement('textarea');
                textarea.className = 'page-text';
                textarea.placeholder = `Пишите на странице ${currentPage}...`;
                textarea.value = page.text || '';
                
                textarea.addEventListener('input', () => {
                    if (!notebookData[pageKey]) notebookData[pageKey] = { text: '', images: [] };
                    notebookData[pageKey].text = textarea.value;
                    saveNotebook();
                });

                pageContent.appendChild(textarea);

                const imgContainer = document.createElement('div');
                imgContainer.className = 'page-images';
                imgContainer.id = 'pageImages';
                if (page.images && page.images.length > 0) {
                    page.images.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.className = 'image-preview';
                        imgContainer.appendChild(img);
                    });
                }
                pageContent.appendChild(imgContainer);
            }

            pageInfo.innerText = `Страница ${currentPage} из ${TOTAL_PAGES}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === TOTAL_PAGES;
        }

        prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderPage(); } };
        nextBtn.onclick = () => { if (currentPage < TOTAL_PAGES) { currentPage++; renderPage(); } };

        async function saveNotebook() {
            const { error } = await supabaseClient.from('homework').upsert([{
                student_id: studentId,
                pages: notebookData,
                updated_at: new Date().toISOString()
            }], { onConflict: 'student_id' });

            if (error) showStatus('Ошибка сохранения!', true);
            else showStatus('Сохранено');
        }

        function setupAdminUI() {
            if (isStudent) return;

            const toolbar = document.createElement('div');
            toolbar.className = 'admin-toolbar';
            toolbar.innerHTML = `
                <label class="btn-tool">
                    🖼️ Картинка
                    <input type="file" id="imageInput" accept="image/*">
                </label>
                <button class="btn-tool" id="saveBtn">💾 Сохранить</button>
            `;
            document.body.appendChild(toolbar);

            document.getElementById('imageInput').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const pageKey = String(currentPage);
                    if (!notebookData[pageKey]) notebookData[pageKey] = { text: '', images: [] };
                    if (!notebookData[pageKey].images) notebookData[pageKey].images = [];
                    
                    notebookData[pageKey].images.push(event.target.result);
                    
                    const imgContainer = document.getElementById('pageImages');
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.className = 'image-preview';
                    imgContainer.appendChild(img);
                    
                    saveNotebook();
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('saveBtn').addEventListener('click', saveNotebook);
        }

        function showStatus(text, isError = false) {
            statusEl.innerText = text;
            statusEl.style.color = isError ? '#ff6b6b' : 'var(--accent-lime)';
            statusEl.classList.add('show');
            setTimeout(() => statusEl.classList.remove('show'), 2000);
        }

        if (studentId) loadNotebook();
        else pageContent.innerHTML = '<p style="color:red;">Ошибка: не передан ID ученика.</p>';
    </script>
</body>
</html>
