<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хранилище знаний | The Curator’s</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border-bottom: 1px solid rgba(244, 243, 238, 0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-container img { width: 150px; height: auto; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .header-right span { font-size: 0.9rem; opacity: 0.7; }
        .btn-logout { color: var(--accent-lime); text-decoration: none; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--accent-lime); padding: 8px 15px; border-radius: 10px; transition: 0.3s; }
        .btn-logout:hover { background: var(--accent-lime); color: var(--bg-color); }

        .container { padding: 40px 5%; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }
        
        .page-header { margin-bottom: 40px; }
        .page-header h1 { font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 800; margin-bottom: 10px; }
        .page-header h1 span { color: var(--accent-lime); }
        .page-header p { opacity: 0.7; font-size: 1.1rem; }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .material-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(244, 243, 238, 0.05);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
        }
        .material-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-lime);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .file-icon {
            width: 48px; height: 48px; border-radius: 12px; background: rgba(197, 240, 90, 0.1);
            display: flex; justify-content: center; align-items: center; font-size: 1.5rem;
            color: var(--accent-lime); margin-bottom: 15px;
        }

        .file-name {
            font-size: 1.1rem; font-weight: 600; margin-bottom: 8px;
            word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .file-meta {
            font-size: 0.85rem; opacity: 0.6; margin-bottom: 20px;
        }

        .download-btn {
            background: var(--bg-color); color: var(--text-main); border: 1px solid rgba(244, 243, 238, 0.2);
            padding: 10px 15px; border-radius: 10px; font-weight: 600; cursor: pointer;
            text-align: center; text-decoration: none; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .download-btn:hover {
            background: var(--accent-lime); color: var(--bg-color); border-color: var(--accent-lime);
        }

        .loading-state { text-align: center; padding: 50px; font-size: 1.2rem; opacity: 0.5; }
        
        /* Скрываем страницу до проверки авторизации */
        #page-content { display: none; }

        /* Исправление кнопки "Выйти" для PWA/мобильных */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding-top: calc(15px + env(safe-area-inset-top)) !important;
            }
            .header-right {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            #user-info {
                font-size: 1rem;
                font-weight: 600;
                color: var(--accent-lime);
                max-width: 60%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* Делаем кнопку "Выйти" аккуратной */
            .btn-logout {
                padding: 8px 16px;
                font-size: 0.9rem;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="admin.html" class="logo-container"><img src="logo.png" alt="Logo"></a>
        <div class="header-right">
            <span id="user-info">Загрузка...</span>
            <a href="admin.html" class="btn-logout">Вернуться</a>
        </div>
    </header>

    <!-- Контент страницы -->
    <div class="container" id="page-content">
        <div class="page-header">
            <h1>Хранилище <span>знаний</span></h1>
            <p>Конспекты, презентации и методические материалы платформы.</p>
            <input type="file" id="fileUploadInput" style="display: none;">
            <button class="download-btn" id="uploadBtn" style="display: none; width: auto; margin-top: 20px; background: var(--accent-lime); color: var(--bg-color); border: none;">
                + Загрузить файл
            </button>
        </div>

        <div class="materials-grid" id="materials-grid">
            <div class="loading-state">Загрузка материалов...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }
            
            currentUser = user;

            const { data: profile } = await supabaseClient.from('profiles').select('role, full_name').eq('id', user.id).single();
            
            // Проверка безопасности: если не админ/учитель - выкидываем
            if (!profile || (profile.role !== 'admin' && profile.role !== 'teacher')) {
                window.location.href = profile && profile.role === 'student' ? 'student.html' : 'login.html';
                return;
            }

            document.getElementById('user-info').innerText = profile.full_name;
            document.getElementById('page-content').style.display = 'block';

            // Показываем кнопку только админу
            if (profile.role === 'admin') {
                document.getElementById('uploadBtn').style.display = 'inline-block';
            }

            loadMaterials();

            // --- ЛОГИКА ЗАГРУЗКИ ---
            const fileInput = document.getElementById('fileUploadInput');
            const uploadBtn = document.getElementById('uploadBtn');

            uploadBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = ''; // сброс

                // Ограничение на размер (20MB, как в бакете)
                if (file.size > 20 * 1024 * 1024) {
                    alert('Файл слишком большой. Максимум 20 МБ.');
                    return;
                }

                const originalText = uploadBtn.innerText;
                uploadBtn.innerText = 'Загрузка...';
                uploadBtn.disabled = true;

                // Загружаем файл
                const { data, error } = await supabaseClient.storage
                    .from('materials')
                    .upload(file.name, file, { upsert: true }); // upsert: true перезапишет файл, если имя совпадает

                if (error) {
                    console.error('Ошибка загрузки:', error);
                    alert('Ошибка загрузки: ' + error.message);
                } else {
                    // Перезагружаем список файлов
                    loadMaterials();
                }

                uploadBtn.innerText = originalText;
                uploadBtn.disabled = false;
            });
        }

        async function loadMaterials() {
            const grid = document.getElementById('materials-grid');
            
            // Получаем список файлов из бакета materials
            const { data: files, error } = await supabaseClient
                .storage
                .from('materials')
                .list('', {
                    limit: 100,
                    offset: 0,
                    sortBy: { column: 'name', order: 'asc' },
                });

            if (error) {
                console.error('Ошибка загрузки:', error);
                grid.innerHTML = '<div class="loading-state" style="color: #ff6b6b;">Ошибка загрузки материалов</div>';
                return;
            }

            if (!files || files.length === 0) {
                grid.innerHTML = '<div class="loading-state">В хранилище пока нет файлов.</div>';
                return;
            }

            grid.innerHTML = '';

            files.forEach(file => {
                // Пропускаем служебные файлы Supabase (начинаются с точки)
                if (file.name.startsWith('.')) return;

                const card = document.createElement('div');
                card.className = 'material-card';

                // Определяем иконку и тип по расширению
                const ext = file.name.split('.').pop().toLowerCase();
                let icon = '📄';
                if (ext === 'pdf') icon = '📕';
                if (ext === 'html' || ext === 'htm') icon = '🌐';
                if (ext === 'ppt' || ext === 'pptx') icon = '📊';
                if (ext === 'txt') icon = '📝';

                // Форматируем размер файла
                const sizeKB = (file.metadata.size / 1024).toFixed(1);
                const sizeText = sizeKB > 1024 ? `${(sizeKB / 1024).toFixed(1)} МБ` : `${sizeKB} КБ`;
                
                // Форматируем дату
                const date = new Date(file.created_at).toLocaleDateString('ru-RU');

                card.innerHTML = `
                    <div>
                        <div class="file-icon">${icon}</div>
                        <div class="file-name">${file.name}</div>
                        <div class="file-meta">${sizeText} • ${date}</div>
                    </div>
                    <button class="download-btn" onclick="downloadFile('${file.name}', this)">
                        <span>⬇️</span> Скачать
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        // Функция генерации временной ссылки и скачивания
        window.downloadFile = async function(fileName, btnElement) {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = 'Генерация ссылки...';
            btnElement.disabled = true;

            // Генерируем ссылку на 60 секунд (хватит, чтобы начать скачивание)
            // Параметр download: true заставит браузер скачать HTML-файл, а не открывать его
            const { data, error } = await supabaseClient
                .storage
                .from('materials')
                .createSignedUrl(fileName, 60, { download: fileName });

            if (error) {
                console.error('Ошибка генерации ссылки:', error);
                alert('Не удалось получить ссылку на файл. Проверьте права доступа.');
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
                return;
            }

            // Создаем временную ссылку для скачивания
            const a = document.createElement('a');
            a.href = data.signedUrl;
            // Имя файла для сохранения
            a.download = fileName; 
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // Возвращаем кнопку в исходное состояние
            setTimeout(() => {
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }, 2000);
        };

        init();
    </script>

</body>
</html>
