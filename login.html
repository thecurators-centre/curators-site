<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; form-action 'self';">
    <title>Вход в личный кабинет | The Curator’s</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #25283d;
            --text-main: #f4f3ee;
            --accent-purple: #7455d9;
            --accent-lime: #c5f05a;
            --card-bg: #313452;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(244, 243, 238, 0.05);
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-card img {
            width: 120px;
            margin-bottom: 20px;
        }

        .login-card h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .login-card h1 span { color: var(--accent-lime); }
        
        .login-card p {
            opacity: 0.7;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(244, 243, 238, 0.15);
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-lime);
            box-shadow: 0 0 0 3px rgba(197, 240, 90, 0.15);
        }

        .btn-login {
            width: 100%;
            background: var(--accent-lime);
            color: var(--bg-color);
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(197, 240, 90, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.6;
            transition: var(--transition);
        }
        .back-link:hover { opacity: 1; color: var(--accent-lime); }

        #error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" alt="Logo">
        <h1>Личный <span>кабинет</span></h1>
        <p>Войдите, чтобы отслеживать прогресс</p>

        <form id="login-form">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="username" placeholder="Введите логин" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn-login">Войти</button>
            <div id="error-msg">Неверный логин или пароль</div>
        </form>

        <a href="index.html" class="back-link">← Вернуться на главный сайт</a>
    </div>

    <script>
        // Проверка пароля
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === 'Админ' && pass === '1369631') {
                // Переадресация на страницу администратора
                window.location.href = 'admin.html';
            } else {
                // Для всех остальных - страница ученика (заглушка)
                window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
