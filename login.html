<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://kajvldevytbrkeomwlms.supabase.co; form-action 'self';">
    <title>Вход | The Curator’s</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .login-card img { width: 120px; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: var(--accent-lime); }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(244, 243, 238, 0.15); background: var(--bg-color); color: white; font-size: 1rem; font-family: 'Inter', sans-serif; }
        input:focus { outline: none; border-color: var(--accent-lime); }
        button { width: 100%; padding: 15px; background: var(--accent-lime); color: var(--bg-color); border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-link { display: block; margin-top: 20px; color: var(--text-main); text-decoration: none; font-size: 0.9rem; opacity: 0.6; }
        .back-link:hover { opacity: 1; }
        #error-msg { color: #ff6b6b; font-size: 0.9rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" alt="Logo">
        <h1>Вход</h1>
        <form id="login-form">
            <input type="text" id="login-input" placeholder="Логин (или Email для учителя)" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" id="submit-btn">Войти</button>
            <div id="error-msg">Неверный логин или пароль</div>
        </form>
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            const inputVal = document.getElementById('login-input').value.trim();
            const password = document.getElementById('password').value.trim();

            btn.innerText = 'Проверка...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            // Хитрость: если введен не email (нет символа @), подставляем домен ученика
            let email = inputVal;
            if (!inputVal.includes('@')) {
                email = `${inputVal}@student.curators.local`;
            }

            // 1. Вход через Supabase Auth
            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) {
                errorMsg.innerText = 'Неверный логин или пароль';
                errorMsg.style.display = 'block';
                btn.innerText = 'Войти';
                btn.disabled = false;
                return;
            }

            // 2. Получаем роль из profiles
            const userId = authData.user.id;
            const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('role, full_name')
                .eq('id', userId)
                .single();

            if (profileError || !profile) {
                errorMsg.innerText = 'Ошибка загрузки профиля.';
                errorMsg.style.display = 'block';
                btn.innerText = 'Войти';
                btn.disabled = false;
                return;
            }

            // 3. Перенаправляем по роли
            localStorage.setItem('user_role', profile.role);
            localStorage.setItem('user_name', profile.full_name);

            if (profile.role === 'admin' || profile.role === 'teacher') {
                window.location.href = 'admin.html';
            } else if (profile.role === 'student') {
                window.location.href = 'student.html';
            } else {
                errorMsg.innerText = 'Неизвестная роль.';
                errorMsg.style.display = 'block';
                btn.innerText = 'Войти';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
