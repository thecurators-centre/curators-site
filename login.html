<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | The Curator’s</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #25283d; color: #f4f3ee; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #313452; padding: 40px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #c5f05a; font-size: 1.8rem; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #555; background: #25283d; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #c5f05a; color: #25283d; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        a { color: #888; text-decoration: none; display: block; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Вход</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Логин" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <a href="index.html">На главную</a>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var user = document.getElementById('username').value.trim().toLowerCase();
            var pass = document.getElementById('password').value.trim();
            if (user === 'админ' && pass === '1369631') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
