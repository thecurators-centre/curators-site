<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер | The Curator’s</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border-bottom: 1px solid rgba(244, 243, 238, 0.1); z-index: 9999; position: relative; flex-shrink: 0; }
        .logo-container img { width: 150px; height: auto; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .header-right span { font-size: 0.9rem; opacity: 0.7; }
        .btn-logout { color: var(--accent-lime); text-decoration: none; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--accent-lime); padding: 8px 15px; border-radius: 10px; transition: 0.3s; }
        .btn-logout:hover { background: var(--accent-lime); color: var(--bg-color); }
        
        .chat-container { display: flex; flex: 1; overflow: hidden; max-width: 1400px; margin: 0 auto; width: 100%; background: var(--bg-color); }
        .chat-sidebar { width: 320px; background: var(--card-bg); border-right: 1px solid rgba(244, 243, 238, 0.1); display: flex; flex-direction: column; flex-shrink: 0; position: relative; z-index: 10; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(244, 243, 238, 0.1); }
        .sidebar-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sidebar-top h2 { font-size: 1.2rem; color: var(--accent-lime); margin: 0; }
        
        .btn-new-chat { background: var(--accent-lime); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; position: relative; transition: 0.2s; z-index: 20; display: flex; justify-content: center; align-items: center; }
        .btn-new-chat::before { content: ''; position: absolute; width: 14px; height: 2px; background-color: var(--bg-color); border-radius: 1px; }
        .btn-new-chat::after { content: ''; position: absolute; width: 2px; height: 14px; background-color: var(--bg-color); border-radius: 1px; }
        .btn-new-chat:hover { transform: scale(1.1); }

        .search-input { width: 100%; padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(244, 243, 238, 0.15); background: var(--bg-color); color: white; font-family: inherit; box-sizing: border-box; }
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px; margin-bottom: 5px; position: relative; }
        .chat-item:hover { background: rgba(255,255,255,0.05); }
        .chat-item.active { background: rgba(197, 240, 90, 0.1); border: 1px solid rgba(197, 240, 90, 0.3); }
        
        .chat-avatar { width: 45px; height: 45px; background: var(--accent-purple); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; flex-shrink: 0; overflow: hidden; }
        .chat-avatar.avatar-student { background: var(--accent-lime); color: var(--bg-color); }

        .chat-info { flex: 1; overflow: hidden; }
        .chat-info h4 { font-size: 1rem; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-info p { font-size: 0.85rem; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .unread-badge { background: var(--danger); color: white; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; min-width: 20px; text-align: center; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: #1a1c29; position: relative; }
        .chat-main-header { padding: 15px 25px; background: var(--card-bg); border-bottom: 1px solid rgba(244, 243, 238, 0.1); display: flex; align-items: center; gap: 15px; }
        .chat-main-header h3 { font-size: 1.1rem; display: flex; align-items: center; }
        .messages-area { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 70%; padding: 12px 18px; border-radius: 15px; position: relative; word-wrap: break-word; }
        .message.sent { align-self: flex-end; background: var(--accent-purple); color: white; border-bottom-right-radius: 4px; }
        .message.received { align-self: flex-start; background: var(--card-bg); color: var(--text-main); border-bottom-left-radius: 4px; }
        .message-time { font-size: 0.7rem; opacity: 0.6; margin-top: 5px; text-align: right; }
        
        .chat-input-area { padding: 20px; background: var(--card-bg); border-top: 1px solid rgba(244, 243, 238, 0.1); display: flex; gap: 10px; align-items: center; position: relative; }
        .chat-input { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid rgba(244, 243, 238, 0.15); background: var(--bg-color); color: white; font-family: inherit; resize: none; height: 50px; outline: none; }
        .btn-send { background: var(--accent-lime); color: var(--bg-color); border: none; border-radius: 12px; padding: 0 25px; height: 50px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-send:hover { transform: scale(1.05); }
        
        .btn-emoji { background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; padding: 0 5px; transition: 0.2s; }
        .btn-emoji:hover { transform: scale(1.2); }

        .emoji-picker { position: absolute; bottom: 80px; left: 20px; background: var(--card-bg); border-radius: 15px; padding: 15px; display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .emoji-picker.active { display: grid; }
        .emoji-btn { background: transparent; border: none; cursor: pointer; padding: 5px; border-radius: 10px; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .emoji-btn:hover { background: rgba(255,255,255,0.1); }
        .emoji-btn svg { width: 35px; height: 35px; }

        .empty-state { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; opacity: 0.5; text-align: center; padding: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 10000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-color); padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .user-list-item { padding: 15px; border-radius: 10px; background: var(--card-bg); margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px; }
        .user-list-item:hover { background: rgba(255,255,255,0.1); }

        @media (max-width: 768px) {
            .chat-sidebar { width: 100%; border-right: none; }
            .chat-main { display: none; }
            .chat-container.show-chat .chat-sidebar { display: none; }
            .chat-container.show-chat .chat-main { display: flex; }
            .header-right span { display: none; }
        }

        /* Фикс для SVG внутри аватарок */
        .chat-avatar svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
            object-fit: cover;
            border-radius: 50%;
        }

        .btn-emoji svg {
            pointer-events: none; /* Чтобы клик по иконке срабатывал на кнопку */
        }
    </style>
</head>
<body>
    <header>
        <a href="admin.html" class="logo-container" id="logo-link"><img src="logo.png" alt="Logo"></a>
        <div class="header-right">
            <span id="header-name">Загрузка...</span>
            <a href="#" id="back-btn" class="btn-logout">Вернуться</a>
        </div>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-top">
                    <h2>Чаты</h2>
                    <button class="btn-new-chat" id="btn-new-chat" style="display: none;"></button>
                </div>
                <input type="text" class="search-input" id="search-input" placeholder="Поиск...">
            </div>
            <div class="chat-list" id="chat-list">
                <div class="empty-state">Загрузка чатов...</div>
            </div>
        </div>

        <div class="chat-main" id="chat-main">
            <div class="empty-state" id="empty-chat-state">
                <h2>Выберите чат</h2>
                <p>Выберите чат слева, чтобы начать общение</p>
            </div>

            <div id="chat-window" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-main-header" id="chat-header">
                    <div class="chat-avatar" id="chat-header-avatar"></div>
                    <h3 id="chat-header-name"></h3>
                    <span id="chat-online-indicator" style="display: none; width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); margin-left: 8px;"></span>
                </div>
                <div class="messages-area" id="messages-area"></div>
                <div class="chat-input-area">
                    <div class="emoji-picker" id="emojiPicker"></div>
                    <button class="btn-emoji" id="btn-emoji" style="display: flex; align-items: center; justify-content: center;">
                        <svg viewBox="0 0 24 24" style="width: 24px; height: 24px; fill: none; stroke: var(--accent-lime); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                    </button>
                    <textarea class="chat-input" id="chat-input" placeholder="Напишите сообщение..."></textarea>
                    <button class="btn-send" id="btn-send">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="new-chat-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>
            <h2 style="margin-bottom: 20px;">Новый чат</h2>
            <input type="text" class="search-input" id="user-search" placeholder="Поиск пользователя..." style="margin-bottom: 15px;">
            <div id="user-list">
                <p style="text-align:center; opacity:0.5;">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- АВАТАРКИ ---
        const avatars = {
            'cat': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#c5f05a"/><path d="M30 40 L20 20 L40 30 Z" fill="#25283d"/><path d="M70 40 L80 20 L60 30 Z" fill="#25283d"/><circle cx="50" cy="55" r="30" fill="#25283d"/><circle cx="35" cy="50" r="5" fill="#c5f05a"/><circle cx="65" cy="50" r="5" fill="#c5f05a"/><path d="M45 65 Q50 70 55 65" stroke="#c5f05a" stroke-width="3" fill="none"/></svg>`,
            'dog': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#7455d9"/><ellipse cx="30" cy="40" rx="10" ry="20" fill="#25283d"/><ellipse cx="70" cy="40" rx="10" ry="20" fill="#25283d"/><circle cx="50" cy="55" r="30" fill="#25283d"/><circle cx="40" cy="50" r="5" fill="white"/><circle cx="60" cy="50" r="5" fill="white"/><ellipse cx="50" cy="65" rx="8" ry="5" fill="white"/></svg>`,
            'fox': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#ff6b6b"/><path d="M20 50 L10 15 L35 35 Z" fill="#25283d"/><path d="M80 50 L90 15 L65 35 Z" fill="#25283d"/><circle cx="50" cy="55" r="30" fill="#25283d"/><path d="M40 60 L50 70 L60 60" stroke="white" stroke-width="3" fill="none"/></svg>`,
            'robot': `<svg viewBox="0 0 100 100"><rect x="0" y="0" width="100" height="100" fill="#313452"/><rect x="25" y="30" width="50" height="40" rx="10" fill="#c5f05a"/><circle cx="40" cy="45" r="5" fill="#25283d"/><circle cx="60" cy="45" r="5" fill="#25283d"/><rect x="40" y="55" width="20" height="5" fill="#25283d"/><line x1="50" y1="15" x2="50" y2="30" stroke="white" stroke-width="3"/><circle cx="50" cy="12" r="4" fill="white"/></svg>`,
            'alien': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#c5f05a"/><ellipse cx="50" cy="50" rx="30" ry="40" fill="#25283d"/><ellipse cx="35" cy="45" rx="8" ry="15" fill="white" transform="rotate(-20 35 45)"/><ellipse cx="65" cy="45" rx="8" ry="15" fill="white" transform="rotate(20 65 45)"/></svg>`,
            'bear': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#7455d9"/><circle cx="25" cy="25" r="15" fill="#25283d"/><circle cx="75" cy="25" r="15" fill="#25283d"/><circle cx="50" cy="55" r="35" fill="#25283d"/><circle cx="40" cy="50" r="5" fill="white"/><circle cx="60" cy="50" r="5" fill="white"/><circle cx="50" cy="65" r="10" fill="white"/><circle cx="50" cy="65" r="5" fill="#25283d"/></svg>`,
            'owl': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#f4f3ee"/><circle cx="50" cy="55" r="35" fill="#25283d"/><circle cx="35" cy="45" r="12" fill="white"/><circle cx="65" cy="45" r="12" fill="white"/><circle cx="35" cy="45" r="5" fill="#25283d"/><circle cx="65" cy="45" r="5" fill="#25283d"/><path d="M45 65 L50 75 L55 65 Z" fill="#c5f05a"/></svg>`,
            'hero': `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#ff6b6b"/><circle cx="50" cy="40" r="20" fill="#25283d"/><path d="M20 100 Q20 70 50 70 Q80 70 80 100" fill="#25283d"/><path d="M30 40 Q50 20 70 40" stroke="#c5f05a" stroke-width="5" fill="none"/><circle cx="50" cy="40" r="5" fill="white"/></svg>`
        };

        // --- СМАЙЛИКИ ---
        const customEmojis = {
            'smile_laugh': { code: '[smile_laugh]', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#c5f05a"/><path d="M30 55 Q50 80 70 55" stroke="#25283d" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="35" cy="40" r="5" fill="#25283d"/><circle cx="65" cy="40" r="5" fill="#25283d"/><path d="M25 35 L40 30" stroke="#25283d" stroke-width="4" stroke-linecap="round"/><path d="M75 35 L60 30" stroke="#25283d" stroke-width="4" stroke-linecap="round"/></svg>` },
            'smile_cry': { code: '[smile_cry]', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#7455d9"/><path d="M30 65 Q50 45 70 65" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="35" cy="40" r="5" fill="white"/><circle cx="65" cy="40" r="5" fill="white"/><path d="M35 45 Q30 60 35 70" stroke="#0ea5e9" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M65 45 Q70 60 65 70" stroke="#0ea5e9" stroke-width="8" fill="none" stroke-linecap="round"/></svg>` },
            'smile_angry': { code: '[smile_angry]', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#ff6b6b"/><path d="M30 65 Q50 55 70 65" stroke="#25283d" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="35" cy="45" r="5" fill="#25283d"/><circle cx="65" cy="45" r="5" fill="#25283d"/><path d="M25 35 L40 45" stroke="#25283d" stroke-width="5" stroke-linecap="round"/><path d="M75 35 L60 45" stroke="#25283d" stroke-width="5" stroke-linecap="round"/></svg>` },
            'smile_shy': { code: '[smile_shy]', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#f4f3ee"/><path d="M40 60 Q50 65 60 60" stroke="#25283d" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="35" cy="45" r="4" fill="#25283d"/><circle cx="65" cy="45" r="4" fill="#25283d"/><ellipse cx="25" cy="55" rx="8" ry="4" fill="#ff6b6b" opacity="0.5"/><ellipse cx="75" cy="55" rx="8" ry="4" fill="#ff6b6b" opacity="0.5"/><path d="M35 85 Q50 75 65 85" stroke="#25283d" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M45 85 L45 95 M55 85 L55 95" stroke="#25283d" stroke-width="4" stroke-linecap="round"/></svg>` }
        };

        let currentUser = null;
        let currentUserRole = null;
        let currentChatId = null;
        let allChats = [];
        let realtimeChannel = null;
        let presenceChannel = null;
        let onlineUsers = new Set();

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;

            const { data: profile } = await supabaseClient.from('profiles').select('role, full_name').eq('id', user.id).single();
            if (!profile) { window.location.href = 'login.html'; return; }
            
            currentUserRole = profile.role;
            document.getElementById('header-name').innerText = profile.full_name;

            const backBtn = document.getElementById('back-btn');
            const logoLink = document.getElementById('logo-link');
            if (currentUserRole === 'student') {
                backBtn.href = 'student.html';
                backBtn.innerText = 'Вернуться в кабинет';
                logoLink.href = 'student.html';
            } else {
                backBtn.href = 'admin.html';
                backBtn.innerText = 'Вернуться в админку';
                logoLink.href = 'admin.html';
            }

            if (currentUserRole === 'admin' || currentUserRole === 'teacher') {
                const btn = document.getElementById('btn-new-chat');
                if (btn) btn.style.display = 'flex';
            }

            setupEmojiPicker();
            loadChats();
            setupPresence();
        }

        // --- СМАЙЛИКИ ---
        function setupEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            const btn = document.getElementById('btn-emoji');
            const input = document.getElementById('chat-input');

            picker.innerHTML = '';
            Object.keys(customEmojis).forEach(key => {
                const emoji = customEmojis[key];
                const btnEl = document.createElement('button');
                btnEl.className = 'emoji-btn';
                btnEl.innerHTML = emoji.svg;
                btnEl.onclick = (e) => {
                    e.preventDefault();
                    input.value += ` ${emoji.code} `;
                    input.focus();
                    picker.classList.remove('active');
                };
                picker.appendChild(btnEl);
            });

            btn.onclick = (e) => {
                e.preventDefault();
                picker.classList.toggle('active');
            };

            document.addEventListener('click', (e) => {
                if (!picker.contains(e.target) && e.target !== btn) {
                    picker.classList.remove('active');
                }
            });
        }

        function renderMessageContent(text) {
            let html = text;
            Object.keys(customEmojis).forEach(key => {
                const emoji = customEmojis[key];
                const regex = new RegExp(emoji.code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                html = html.replace(regex, `<span style="display:inline-block; width:24px; height:24px; vertical-align:middle; margin:0 2px;">${emoji.svg}</span>`);
            });
            return html.replace(/\n/g, '<br>');
        }

        // --- ОНЛАЙН СТАТУС ---
        function setupPresence() {
            presenceChannel = supabaseClient.channel('online-users', {
                config: { presence: { key: currentUser.id } }
            });

            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const newState = presenceChannel.presenceState();
                    onlineUsers.clear();
                    for (const id in newState) onlineUsers.add(id);
                    updateOnlineStatus();
                })
                .on('presence', { event: 'join' }, ({ key }) => {
                    onlineUsers.add(key);
                    updateOnlineStatus();
                })
                .on('presence', { event: 'leave' }, ({ key }) => {
                    onlineUsers.delete(key);
                    updateOnlineStatus();
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({ online_at: new Date().toISOString() });
                    }
                });
        }

        function updateOnlineStatus() {
            const indicator = document.getElementById('chat-online-indicator');
            if (!currentChatId) { indicator.style.display = 'none'; return; }
            const currentChat = allChats.find(c => c.id === currentChatId);
            if (currentChat && currentChat.otherUserId && onlineUsers.has(currentChat.otherUserId)) {
                indicator.style.display = 'inline-block';
            } else {
                indicator.style.display = 'none';
            }
        }

        // --- СПИСОК ЧАТОВ ---
        async function loadChats() {
            const chatList = document.getElementById('chat-list');
            const { data: myChats, error } = await supabaseClient
                .from('chat_participants')
                .select(`chat_id, chats (id, type, name)`)
                .eq('user_id', currentUser.id);

            if (error || !myChats) { chatList.innerHTML = '<p style="padding:20px;color:red;">Ошибка загрузки</p>'; return; }
            allChats = myChats.map(item => item.chats);

            for (let i = 0; i < allChats.length; i++) {
                const chat = allChats[i];
                const { data: otherParticipants } = await supabaseClient
                    .from('chat_participants')
                    .select('user_id')
                    .eq('chat_id', chat.id)
                    .neq('user_id', currentUser.id);

                if (otherParticipants && otherParticipants.length > 0) {
                    const otherUserId = otherParticipants[0].user_id;
                    chat.otherUserId = otherUserId;
                    // 1. Получаем базовый профиль (имя и роль)
                    const { data: otherProfile } = await supabaseClient
                        .from('profiles')
                        .select('full_name, role')
                        .eq('id', otherUserId)
                        .single();
                    
                    if (otherProfile) {
                        chat.displayName = otherProfile.full_name;
                        chat.otherRole = otherProfile.role;
                    }

                    // 2. Если это ученик, получаем его аватарку из таблицы students
                    if (otherProfile && otherProfile.role === 'student') {
                        const { data: studentData } = await supabaseClient
                            .from('students')
                            .select('avatar_id')
                            .eq('id', otherUserId)
                            .single();
                        if (studentData) {
                            chat.otherAvatar = studentData.avatar_id;
                        }
                    }
                } else {
                    chat.displayName = 'Личный чат';
                    chat.otherRole = 'teacher';
                }

                const { count } = await supabaseClient
                    .from('messages')
                    .select('*', { count: 'exact', head: true })
                    .eq('chat_id', chat.id)
                    .eq('is_read', false)
                    .neq('sender_id', currentUser.id);
                
                chat.unreadCount = count || 0;
            }
            renderChatList();
        }

        function renderChatList() {
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';
            
            if (allChats.length === 0) {
                chatList.innerHTML = '<p style="padding:20px;opacity:0.5;">У вас пока нет чатов</p>';
                return;
            }

            allChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                if (chat.id === currentChatId) div.classList.add('active');
                
                const displayName = chat.displayName || 'Личный чат';
                const avatarClass = chat.otherRole === 'student' ? 'chat-avatar avatar-student' : 'chat-avatar';
                
                let avatarHtml = displayName.charAt(0).toUpperCase();
                if (chat.otherAvatar && avatars[chat.otherAvatar]) {
                    avatarHtml = avatars[chat.otherAvatar]; // Вставляем чистый SVG, CSS его отцентрирует
                }

                const badge = chat.unreadCount > 0 ? `<div class="unread-badge">${chat.unreadCount}</div>` : '';

                div.innerHTML = `
                    <div class="${avatarClass}">${avatarHtml}</div>
                    <div class="chat-info">
                        <h4>${displayName}</h4>
                        <p>Нажмите, чтобы открыть</p>
                    </div>
                    ${badge}
                `;
                div.onclick = () => openChat(chat);
                chatList.appendChild(div);
            });
        }

        async function openChat(chat) {
            currentChatId = chat.id;
            updateOnlineStatus();
            document.getElementById('empty-chat-state').style.display = 'none';
            document.getElementById('chat-window').style.display = 'flex';
            document.getElementById('chat-container').classList.add('show-chat');
            
            const displayName = chat.displayName || 'Личный чат';
            const headerAvatar = document.getElementById('chat-header-avatar');
            
            headerAvatar.className = chat.otherRole === 'student' ? 'chat-avatar avatar-student' : 'chat-avatar';
            if (chat.otherAvatar && avatars[chat.otherAvatar]) {
                headerAvatar.innerHTML = avatars[chat.otherAvatar];
            } else {
                headerAvatar.innerText = displayName.charAt(0).toUpperCase();
            }

            document.getElementById('chat-header-name').innerText = displayName;

            await supabaseClient
                .from('messages')
                .update({ is_read: true })
                .eq('chat_id', chat.id)
                .eq('is_read', false)
                .neq('sender_id', currentUser.id);

            chat.unreadCount = 0;
            renderChatList();

            loadMessages(chat.id);
            subscribeToChat(chat.id);
        }

        async function loadMessages(chatId) {
            const area = document.getElementById('messages-area');
            area.innerHTML = '<p style="text-align:center;opacity:0.5;">Загрузка...</p>';
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('chat_id', chatId)
                .order('created_at', { ascending: true });

            if (error) { area.innerHTML = '<p style="color:red;">Ошибка загрузки</p>'; return; }
            area.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
            scrollToBottom();
        }

        function appendMessage(msg) {
            const area = document.getElementById('messages-area');
            const isSent = msg.sender_id === currentUser.id;
            const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            
            const div = document.createElement('div');
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            div.innerHTML = `<div>${renderMessageContent(msg.content)}</div><div class="message-time">${time}</div>`;
            area.appendChild(div);
        }

        function scrollToBottom() {
            const area = document.getElementById('messages-area');
            area.scrollTop = area.scrollHeight;
        }

        document.getElementById('btn-send').onclick = sendMessage;
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            input.value = '';
            const tempMsg = { id: 'temp-' + Date.now(), sender_id: currentUser.id, content: text, created_at: new Date().toISOString() };
            appendMessage(tempMsg);
            scrollToBottom();

            const { error } = await supabaseClient.from('messages').insert([{
                chat_id: currentChatId, sender_id: currentUser.id, content: text, is_read: false
            }]);

            if (error) alert('Ошибка отправки: ' + error.message);
        }

        function subscribeToChat(chatId) {
            if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);
            realtimeChannel = supabaseClient
                .channel('chat_' + chatId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, payload => {
                    const newMsg = payload.new;
                    if (newMsg.sender_id !== currentUser.id) {
                        appendMessage(newMsg);
                        scrollToBottom();
                        supabaseClient.from('messages').update({ is_read: true }).eq('id', newMsg.id);
                    }
                })
                .subscribe();
        }

        const modal = document.getElementById('new-chat-modal');
        document.getElementById('btn-new-chat').onclick = () => { modal.classList.add('active'); loadUsersForNewChat(); };
        document.getElementById('close-modal').onclick = () => modal.classList.remove('active');
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

        async function loadUsersForNewChat() {
            const list = document.getElementById('user-list');
            list.innerHTML = 'Загрузка...';
            
            const { data: users, error } = await supabaseClient
                .from('profiles')
                .select('id, full_name, role, avatar_id')
                .neq('id', currentUser.id);

            if (error) { list.innerHTML = 'Ошибка загрузки'; return; }
            
            list.innerHTML = '';
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-list-item';
                const avatarClass = u.role === 'student' ? 'chat-avatar avatar-student' : 'chat-avatar';
                
                let avatarHtml = u.full_name.charAt(0);
                if (u.avatar_id && avatars[u.avatar_id]) {
                    avatarHtml = `<div style="width: 100%; height: 100%; padding: 2px;">${avatars[u.avatar_id]}</div>`;
                }

                div.innerHTML = `<div class="${avatarClass}" style="width:35px;height:35px;font-size:0.8rem;">${avatarHtml}</div><div><b>${u.full_name}</b><br><small style="opacity:0.6;">${u.role}</small></div>`;
                div.onclick = () => createDirectChat(u.id);
                list.appendChild(div);
            });
        }

        async function createDirectChat(targetUserId) {
            const newChatId = crypto.randomUUID();
            const { error: chatError } = await supabaseClient.from('chats').insert([{ id: newChatId, type: 'direct' }]);
            if (chatError) { alert('Ошибка создания чата: ' + chatError.message); return; }

            const { error: partError } = await supabaseClient.from('chat_participants').insert([
                { chat_id: newChatId, user_id: currentUser.id },
                { chat_id: newChatId, user_id: targetUserId }
            ]);
            if (partError) { alert('Ошибка добавления участников: ' + partError.message); return; }

            modal.classList.remove('active');
            loadChats();
        }

        init();
    </script>
</body>
</html>
