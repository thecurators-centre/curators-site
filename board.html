<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Интерактивная доска | The Curator’s</title>
    <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
    <style>
        :root { --bg-color: #25283d; --card-bg: #313452; --accent-lime: #c5f05a; --text-main: #f4f3ee; }
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); height: 100vh; }
        
        .toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg); padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 15px; align-items: center; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap; justify-content: center; width: max-content; max-width: 95vw;
        }
        .tool-btn {
            background: none; border: none; color: var(--text-main); cursor: pointer;
            padding: 8px 12px; border-radius: 10px; font-size: 1.2rem; transition: 0.2s;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .tool-btn.active { background: var(--accent-lime); color: var(--bg-color); }
        .color-picker { width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer; padding: 0; }
        
        .slider-container { display: flex; align-items: center; gap: 8px; }
        .slider-container input[type="range"] { width: 80px; accent-color: var(--accent-lime); cursor: pointer; }
        .slider-label { font-size: 0.8rem; opacity: 0.7; width: 20px; text-align: center; }

        .board-title {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--card-bg); padding: 10px 20px; border-radius: 10px;
            font-size: 1.2rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.1);
        }

        #container { width: 100vw; height: 100vh; background-color: #1a1c29; cursor: crosshair; }
        
        .exit-btn {
            position: absolute; bottom: 20px; right: 20px; background: var(--card-bg);
            color: var(--text-main); padding: 10px 20px; border-radius: 10px; text-decoration: none;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s;
        }
        .exit-btn:hover { background: #ff6b6b; color: white; }

        .background-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.05; z-index: 0; background-image: radial-gradient(var(--text-main) 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body>

    <div class="board-title" id="boardTitle">Загрузка...</div>

    <div class="toolbar" id="toolbar">
        <button class="tool-btn active" data-tool="pen" title="Карандаш">✏️</button>
        <button class="tool-btn" data-tool="eraser" title="Ластик">🧽</button>
        <button class="tool-btn" data-tool="rect" title="Прямоугольник">⬛</button>
        <button class="tool-btn" data-tool="circle" title="Окружность">⭕</button>
        <input type="color" id="colorPicker" class="color-picker" value="#c5f05a" title="Цвет">
        <div class="slider-container">
            <span style="font-size: 1rem;">🔹</span>
            <input type="range" id="strokeWidth" min="1" max="50" value="4">
            <span class="slider-label" id="strokeVal">4</span>
        </div>
        <button class="tool-btn" id="clearBtn" title="Очистить" style="color: #ff6b6b;">🗑️</button>
    </div>

    <div class="background-grid" id="grid"></div>
    <div id="container"></div>

    <a href="admin.html" class="exit-btn" id="backBtn">Выйти</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const subject = urlParams.get('subject') || 'Общая доска';
        const isStudent = urlParams.get('role') === 'student';
        
        document.getElementById('boardTitle').innerText = `Доска: ${subject}`;
        
        if (isStudent) {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('backBtn').href = 'student.html';
            document.getElementById('backBtn').innerText = 'Вернуться в кабинет';
        }

        const container = document.getElementById('container');
        const stage = new Konva.Stage({
            container: 'container',
            width: window.innerWidth,
            height: window.innerHeight,
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        let currentTool = 'pen';
        let isDrawing = false;
        let currentLine = null;
        let currentShape = null;
        let startX, startY;
        
        const colorPicker = document.getElementById('colorPicker');
        const strokeWidthSlider = document.getElementById('strokeWidth');
        const strokeVal = document.getElementById('strokeVal');

        strokeWidthSlider.addEventListener('input', (e) => {
            strokeVal.innerText = e.target.value;
        });

        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTool = e.target.dataset.tool;
            });
        });

        stage.on('mousedown touchstart', (e) => {
            if (isStudent) return;
            isDrawing = true;
            const pos = stage.getPointerPosition();
            startX = pos.x;
            startY = pos.y;

            const width = parseInt(strokeWidthSlider.value);
            const color = colorPicker.value;

            if (currentTool === 'pen') {
                currentLine = new Konva.Line({
                    stroke: color, strokeWidth: width, lineCap: 'round', lineJoin: 'round',
                    points: [pos.x, pos.y], globalCompositeOperation: 'source-over'
                });
                layer.add(currentLine);
            } 
            else if (currentTool === 'eraser') {
                currentLine = new Konva.Line({
                    stroke: '#000', strokeWidth: width * 2, lineCap: 'round', lineJoin: 'round',
                    points: [pos.x, pos.y], globalCompositeOperation: 'destination-out'
                });
                layer.add(currentLine);
            } 
            else if (currentTool === 'rect') {
                currentShape = new Konva.Rect({
                    x: pos.x, y: pos.y, width: 0, height: 0,
                    stroke: color, strokeWidth: width, fill: 'transparent'
                });
                layer.add(currentShape);
            }
            else if (currentTool === 'circle') {
                currentShape = new Konva.Ellipse({
                    x: pos.x, y: pos.y, radiusX: 0, radiusY: 0,
                    stroke: color, strokeWidth: width, fill: 'transparent'
                });
                layer.add(currentShape);
            }
            layer.batchDraw();
        });

        stage.on('mousemove touchmove', (e) => {
            if (!isDrawing || isStudent) return;
            const pos = stage.getPointerPosition();

            if (currentTool === 'pen' || currentTool === 'eraser') {
                if (currentLine) {
                    let newPoints = currentLine.points().concat([pos.x, pos.y]);
                    currentLine.points(newPoints);
                }
            } 
            else if (currentTool === 'rect' && currentShape) {
                const width = pos.x - startX;
                const height = pos.y - startY;
                if (width < 0) {
                    currentShape.x(pos.x);
                    currentShape.width(Math.abs(width));
                } else {
                    currentShape.x(startX);
                    currentShape.width(width);
                }
                if (height < 0) {
                    currentShape.y(pos.y);
                    currentShape.height(Math.abs(height));
                } else {
                    currentShape.y(startY);
                    currentShape.height(height);
                }
            }
            else if (currentTool === 'circle' && currentShape) {
                const radiusX = Math.abs(pos.x - startX);
                const radiusY = Math.abs(pos.y - startY);
                currentShape.radiusX(radiusX);
                currentShape.radiusY(radiusY);
                currentShape.x(startX + (pos.x - startX) / 2);
                currentShape.y(startY + (pos.y - startY) / 2);
            }
            layer.batchDraw();
        });

        stage.on('mouseup touchend', () => {
            isDrawing = false;
            currentLine = null;
            currentShape = null;
            layer.batchDraw();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (isStudent) return;
            if (confirm('Очистить всю доску?')) {
                layer.destroyChildren();
                layer.draw();
            }
        });

        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            const oldScale = stage.scaleX();
            const pointer = stage.getPointerPosition();
            const mousePointTo = {
                x: (pointer.x - stage.x()) / oldScale,
                y: (pointer.y - stage.y()) / oldScale,
            };
            let direction = e.evt.deltaY > 0 ? -1 : 1;
            const scaleBy = 1.1;
            const newScale = direction > 0 ? oldScale * scaleBy : oldScale / scaleBy;
            stage.scale({ x: newScale, y: newScale });
            const newPos = {
                x: pointer.x - mousePointTo.x * newScale,
                y: pointer.y - mousePointTo.y * newScale,
            };
            stage.position(newPos);
        });

        stage.on('mousedown', (e) => {
            if (e.evt.button === 2) stage.draggable(true);
        });
        stage.on('mouseup', () => {
            stage.draggable(false);
        });
        
        stage.container().addEventListener('contextmenu', (e) => e.preventDefault());

        window.addEventListener('resize', () => {
            stage.width(window.innerWidth);
            stage.height(window.innerHeight);
            layer.batchDraw();
        });
    </script>
</body>
</html>
