<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Интерактивная доска | The Curator’s</title>
    <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #25283d; --card-bg: #313452; --accent-lime: #c5f05a; --text-main: #f4f3ee; }
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); height: 100vh; }
        
        .toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg); padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 10px; align-items: center; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap; justify-content: center; width: max-content; max-width: 95vw;
        }
        .tool-btn {
            background: none; border: none; color: var(--text-main); cursor: pointer;
            padding: 8px 12px; border-radius: 10px; font-size: 1.2rem; transition: 0.2s;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .tool-btn.active { background: var(--accent-lime); color: var(--bg-color); }
        .color-picker { width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer; padding: 0; }
        
        .slider-container { display: flex; align-items: center; gap: 8px; }
        .slider-container input[type="range"] { width: 80px; accent-color: var(--accent-lime); cursor: pointer; }
        .slider-label { font-size: 0.8rem; opacity: 0.7; width: 20px; text-align: center; }

        .shape-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;
        }
        .shape-modal.active { display: flex; }
        .shape-modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px; width: 90%;
        }
        .shape-option {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white;
            padding: 15px; border-radius: 10px; cursor: pointer; font-size: 1.1rem;
            text-align: center; transition: 0.2s;
        }
        .shape-option:hover { background: var(--accent-lime); color: var(--bg-color); }
        .shape-modal-close {
            grid-column: 1 / -1; background: transparent; color: #ff6b6b; border: none;
            font-size: 1rem; cursor: pointer; margin-top: 10px; padding: 10px;
        }

        .board-title {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--card-bg); padding: 10px 20px; border-radius: 10px;
            font-size: 1.2rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.1);
        }

        #container { width: 100vw; height: 100vh; background-color: #1a1c29; cursor: crosshair; position: relative; }
        
        .text-input-overlay {
            display: flex; flex-direction: column; border-radius: 6px; overflow: hidden; background: rgba(37, 40, 61, 0.95);
            position: absolute; z-index: 1000; background: transparent; border: 1px dashed var(--accent-lime);
            color: white; font-family: 'Inter', sans-serif; outline: none; resize: none; overflow: hidden;
        }

        .exit-btn {
            position: absolute; bottom: 20px; right: 20px; background: var(--card-bg);
            color: var(--text-main); padding: 10px 20px; border-radius: 10px; text-decoration: none;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s;
        }
        .exit-btn:hover { background: #ff6b6b; color: white; }
    </style>
</head>
<body>

    <div class="board-title" id="boardTitle">Загрузка...</div>

    <div class="toolbar" id="toolbar">
        <button class="tool-btn active" data-tool="pen" title="Карандаш">✏️</button>
        <button class="tool-btn" data-tool="eraser" title="Ластик">🧽</button>
        <button class="tool-btn" id="shapeBtn" title="Фигуры">⬛</button>
        <button class="tool-btn" data-tool="text" title="Текст">📝</button>
        <input type="color" id="colorPicker" class="color-picker" value="#c5f05a" title="Цвет">
        <div class="slider-container">
            <span style="font-size: 1rem;">🔹</span>
            <input type="range" id="strokeWidth" min="1" max="100" value="4">
            <span class="slider-label" id="strokeVal">4</span>
        </div>
        <button class="tool-btn" id="imageBtn" title="Вставить картинку">🖼️</button>
        <button class="tool-btn" id="clearBtn" title="Очистить" style="color: #ff6b6b;">🗑️</button>
    </div>

    <div class="shape-modal" id="shapeModal">
        <div class="shape-modal-content">
            <div class="shape-option" data-shape="rect">⬛ Прямоугольник</div>
            <div class="shape-option" data-shape="circle">⭕ Круг</div>
            <div class="shape-option" data-shape="triangle">🔺 Треугольник</div>
            <div class="shape-option" data-shape="diamond">🔷 Ромб</div>
            <div class="shape-option" data-shape="star">⭐ Звезда</div>
            <div class="shape-option" data-shape="arrow">➡️ Стрелка</div>
            <button class="shape-modal-close" id="closeShapeModal">Отмена</button>
        </div>
    </div>

    <input type="file" id="imageUploadInput" accept="image/*" style="display: none;">
    <div id="container"></div>
    <a href="admin.html" class="exit-btn" id="backBtn">Выйти</a>
    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const subject = urlParams.get('subject') || 'Общая доска';
        const isStudent = urlParams.get('role') === 'student';
        
        document.getElementById('boardTitle').innerText = `Доска: ${subject}`;
        
        if (isStudent) {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('backBtn').href = 'student.html';
            document.getElementById('backBtn').innerText = 'Вернуться в кабинет';
        }

        const stage = new Konva.Stage({ container: 'container', width: window.innerWidth, height: window.innerHeight });
        const bgLayer = new Konva.Layer({ listening: false });
        const drawLayer = new Konva.Layer();
        const uiLayer = new Konva.Layer({ listening: false });
        stage.add(bgLayer);
        stage.add(drawLayer);
        stage.add(uiLayer);

        function drawGrid() {
            bgLayer.destroyChildren();
            const spacing = 50; 
            const worldSize = 20000;
            const half = worldSize / 2;

            const grid = new Konva.Shape({
                x: -half, y: -half,
                sceneFunc: function(context) {
                    context.beginPath();
                    for (let x = 0; x <= worldSize; x += spacing) {
                        for (let y = 0; y <= worldSize; y += spacing) {
                            context.moveTo(x - 1, y); context.lineTo(x + 1, y);
                            context.moveTo(x, y - 1); context.lineTo(x, y + 1);
                        }
                    }
                    context.strokeStyle = 'rgba(255,255,255,0.1)';
                    context.lineWidth = 1;
                    context.stroke();
                },
                listening: false
            });
            bgLayer.add(grid);
            bgLayer.batchDraw();
        }

        stage.position({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
        stage.scale({ x: 1, y: 1 });
        drawGrid();

        let currentTool = 'pen';
        let currentShapeType = 'rect';
        let isDrawing = false;
        let currentLine = null;
        let currentShape = null;
        let startX, startY;
        let activeTextInput = null;
        let broadcastChannel = null;
        let teacherCursor = null;
        let lastBroadcastTime = 0; 
        const BROADCAST_THROTTLE = 100; 

        let studentObjects = {}; 
        let currentStrokeId = null;

        let activeArrow = null;
        let rotateAnchor = null;

        const colorPicker = document.getElementById('colorPicker');
        const strokeWidthSlider = document.getElementById('strokeWidth');
        const strokeVal = document.getElementById('strokeVal');

        strokeWidthSlider.addEventListener('input', (e) => { strokeVal.innerText = e.target.value; });

        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (isStudent) return;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentTool = e.currentTarget.dataset.tool;
                removeRotateAnchor();
            });
        });

        const shapeBtn = document.getElementById('shapeBtn');
        const shapeModal = document.getElementById('shapeModal');
        shapeBtn.onclick = () => { shapeModal.classList.add('active'); };
        document.getElementById('closeShapeModal').onclick = () => { shapeModal.classList.remove('active'); };
        document.querySelectorAll('.shape-option').forEach(opt => {
            opt.onclick = function() {
                currentShapeType = this.dataset.shape;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                shapeBtn.classList.add('active');
                currentTool = 'shape';
                shapeModal.classList.remove('active');
                removeRotateAnchor();
            };
        });

        function removeRotateAnchor() {
            if (rotateAnchor) { rotateAnchor.destroy(); rotateAnchor = null; }
            if (activeArrow) { activeArrow = null; }
            uiLayer.batchDraw();
        }
        function createRotateAnchor(arrowGroup) {
            removeRotateAnchor();
            activeArrow = arrowGroup;
            
            const endX = arrowGroup.x() + arrowGroup.getChildren()[0].points()[2] * Math.cos(arrowGroup.rotation() * Math.PI / 180);
            const endY = arrowGroup.y() + arrowGroup.getChildren()[0].points()[2] * Math.sin(arrowGroup.rotation() * Math.PI / 180);

            rotateAnchor = new Konva.Circle({
                x: endX, y: endY, radius: 8,
                fill: 'rgba(197, 240, 90, 0.5)', stroke: '#c5f05a', strokeWidth: 2,
                draggable: !isStudent
            });

            rotateAnchor.on('dragmove', (e) => {
                const pos = e.target.position();
                const dx = pos.x - arrowGroup.x();
                const dy = pos.y - arrowGroup.y();
                const angle = Math.atan2(dy, dx);
                const length = Math.sqrt(dx*dx + dy*dy);
                
                arrowGroup.rotation(angle * 180 / Math.PI);
                arrowGroup.getChildren()[0].points([0, 0, length, 0]);
                arrowGroup.getChildren()[1].points([length, 0, length - 15, -8, length - 15, 8, length, 0]);
                
                broadcastArrowUpdate(arrowGroup);
                drawLayer.batchDraw();
            });

            rotateAnchor.on('dragend', () => { broadcastArrowUpdate(arrowGroup, true); });

            uiLayer.add(rotateAnchor);
            uiLayer.batchDraw();
        }

        function broadcastArrowUpdate(arrowGroup, isFinal = false) {
            const obj = {
                type: 'shape', shapeType: 'arrow', id: arrowGroup.id(),
                x: arrowGroup.x(), y: arrowGroup.y(),
                width: arrowGroup.getChildren()[0].points()[2],
                rotation: arrowGroup.rotation(),
                stroke: arrowGroup.getChildren()[0].stroke(),
                strokeWidth: arrowGroup.getChildren()[0].strokeWidth()
            };
            if (isFinal) saveObjectToDB(obj);
            broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: obj });
        }

        stage.on('click tap', (e) => {
            if (currentTool !== 'text' || isStudent) return;
            if (activeTextInput) { activeTextInput.remove(); activeTextInput = null; }

            const pos = stage.getPointerPosition();
            const localX = (pos.x - stage.x()) / stage.scaleX();
            const localY = (pos.y - stage.y()) / stage.scaleY();

            // Создаем контейнер для оверлея
            const overlayWrapper = document.createElement('div');
            overlayWrapper.className = 'text-input-overlay';
            overlayWrapper.style.left = `${pos.x}px`; 
            overlayWrapper.style.top = `${pos.y}px`;
            
            // Создаем шапку с кнопками A- и A+
            const header = document.createElement('div');
            header.className = 'text-overlay-header';
            
            let currentFontSize = parseInt(strokeWidthSlider.value) * 4;
            
            const btnMinus = document.createElement('button');
            btnMinus.className = 'text-size-btn';
            btnMinus.innerText = 'A-';
            btnMinus.onmousedown = (e) => { e.preventDefault(); currentFontSize = Math.max(10, currentFontSize - 4); textarea.style.fontSize = `${currentFontSize}px`; };
            
            const btnPlus = document.createElement('button');
            btnPlus.className = 'text-size-btn';
            btnPlus.innerText = 'A+';
            btnPlus.onmousedown = (e) => { e.preventDefault(); currentFontSize += 4; textarea.style.fontSize = `${currentFontSize}px`; };
            
            header.appendChild(btnMinus);
            header.appendChild(btnPlus);
            
            // Создаем само поле ввода
            const textarea = document.createElement('textarea');
            textarea.className = 'text-overlay-area';
            textarea.style.fontSize = `${currentFontSize}px`;
            textarea.style.color = colorPicker.value;
            
            overlayWrapper.appendChild(header);
            overlayWrapper.appendChild(textarea);
            
            document.getElementById('container').appendChild(overlayWrapper);
            textarea.focus();
            activeTextInput = overlayWrapper;

            textarea.onblur = () => {
                setTimeout(() => {
                    if (document.activeElement === btnMinus || document.activeElement === btnPlus) return;
                    
                    const text = textarea.value.trim();
                    if (text) {
                        const textNode = new Konva.Text({ x: localX, y: localY, text: text, fontSize: currentFontSize, fill: colorPicker.value, fontFamily: 'Inter', draggable: !isStudent });
                        drawLayer.add(textNode); drawLayer.batchDraw();
                        saveObjectToDB({ type: 'text', x: localX, y: localY, text: text, fontSize: currentFontSize, fill: colorPicker.value });
                        broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: { type: 'text', x: localX, y: localY, text: text, fontSize: currentFontSize, fill: colorPicker.value } });
                    }
                    overlayWrapper.remove(); activeTextInput = null;
                }, 100);
            };
        });

        stage.on('mousedown touchstart', (e) => {
            if (isStudent || currentTool === 'text') return;
            if (e.evt.touches && e.evt.touches.length > 1) return;
            if (e.evt.button === 2) return;
            if (currentTool !== 'shape' || currentShapeType !== 'arrow') removeRotateAnchor();

            isDrawing = true;
            const pos = stage.getPointerPosition();
            startX = (pos.x - stage.x()) / stage.scaleX();
            startY = (pos.y - stage.y()) / stage.scaleY();

            const width = parseInt(strokeWidthSlider.value);
            const color = colorPicker.value;
            currentStrokeId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);

            if (currentTool === 'pen') {
                // Сглаживание линий карандаша
                currentLine = new Konva.Line({ stroke: color, strokeWidth: width, lineCap: 'round', lineJoin: 'round', points: [startX, startY], globalCompositeOperation: 'source-over', tension: 0.5 });
                drawLayer.add(currentLine);
            } 
            else if (currentTool === 'eraser') {
                currentLine = new Konva.Line({ stroke: '#000', strokeWidth: width * 2, lineCap: 'round', lineJoin: 'round', points: [startX, startY], globalCompositeOperation: 'destination-out' });
                drawLayer.add(currentLine);
            } 
            else if (currentTool === 'shape') {
                if (currentShapeType === 'rect') currentShape = new Konva.Rect({ x: startX, y: startY, width: 0, height: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'circle') currentShape = new Konva.Ellipse({ x: startX, y: startY, radiusX: 0, radiusY: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'triangle') currentShape = new Konva.RegularPolygon({ x: startX, y: startY, sides: 3, radius: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'diamond') currentShape = new Konva.RegularPolygon({ x: startX, y: startY, sides: 4, radius: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'star') currentShape = new Konva.Star({ x: startX, y: startY, numPoints: 5, innerRadius: 0, outerRadius: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'arrow') {
                    currentShape = new Konva.Group({ x: startX, y: startY });
                    currentShape.id(currentStrokeId);
                    currentShape.add(new Konva.Line({ points: [0, 0, 1, 0], stroke: color, strokeWidth: width, lineCap: 'round' }));
                    currentShape.add(new Konva.Line({ points: [1, 0, 1 - 15, -8, 1 - 15, 8, 1, 0], fill: color, stroke: color, closed: true, strokeWidth: 1 }));
                    currentShape.getChildren()[0].name('arrow-line');
                }
                drawLayer.add(currentShape);
            }
            drawLayer.batchDraw();
        });

        stage.on('mousemove touchmove', (e) => {
            if (isStudent) return;
            const now = Date.now();
            if (now - lastBroadcastTime < BROADCAST_THROTTLE) return; 
            lastBroadcastTime = now;

            const pos = stage.getPointerPosition();
            const localX = (pos.x - stage.x()) / stage.scaleX();
            const localY = (pos.y - stage.y()) / stage.scaleY();

            broadcastChannel.send({ type: 'broadcast', event: 'cursor', payload: { x: localX, y: localY } });

            if (!isDrawing) return;
            if (e.evt.touches && e.evt.touches.length > 1) return;

            if (currentTool === 'pen' || currentTool === 'eraser') {
                if (currentLine) currentLine.points(currentLine.points().concat([localX, localY]));
            } 
            else if (currentTool === 'shape' && currentShape) {
                const w = localX - startX; const h = localY - startY;
                if (currentShapeType === 'rect') {
                    currentShape.x(w < 0 ? localX : startX); currentShape.width(Math.abs(w));
                    currentShape.y(h < 0 ? localY : startY); currentShape.height(Math.abs(h));
                } else if (currentShapeType === 'circle') {
                    currentShape.radiusX(Math.abs(w)); currentShape.radiusY(Math.abs(h));
                    currentShape.x(startX + w / 2); currentShape.y(startY + h / 2);
                } else if (['triangle', 'diamond', 'star'].includes(currentShapeType)) {
                    const dist = Math.sqrt(w*w + h*h);
                    if (currentShapeType === 'star') { currentShape.outerRadius(dist); currentShape.innerRadius(dist * 0.4); }
                    else { currentShape.radius(dist); }
                } else if (currentShapeType === 'arrow') {
                    const angle = Math.atan2(h, w);
                    const length = Math.sqrt(w*w + h*h);
                    currentShape.rotation(angle * 180 / Math.PI);
                    currentShape.getChildren()[0].points([0, 0, length, 0]);
                    currentShape.getChildren()[1].points([length, 0, length - 15, -8, length - 15, 8, length, 0]);
                }
            }
            drawLayer.batchDraw();

            if (currentLine) {
                const obj = { type: 'line', id: currentStrokeId, points: currentLine.points(), stroke: currentLine.stroke(), strokeWidth: currentLine.strokeWidth(), globalCompositeOperation: currentLine.globalCompositeOperation() };
                broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: obj });
            } else if (currentShape) {
                if (currentShapeType === 'arrow') {
                    const obj = { type: 'shape', shapeType: 'arrow', id: currentStrokeId, x: currentShape.x(), y: currentShape.y(), width: currentShape.getChildren()[0].points()[2], rotation: currentShape.rotation(), stroke: currentShape.getChildren()[0].stroke(), strokeWidth: currentShape.getChildren()[0].strokeWidth() };
                    broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: obj });
                } else {
                    const obj = { type: 'shape', shapeType: currentShapeType, id: currentStrokeId, x: currentShape.x(), y: currentShape.y(), width: currentShape.width ? currentShape.width() : (currentShape.radiusX ? currentShape.radiusX() * 2 : 0), height: currentShape.height ? currentShape.height() : (currentShape.radiusY ? currentShape.radiusY() * 2 : 0), radius: currentShape.radius ? currentShape.radius() : null, innerRadius: currentShape.innerRadius ? currentShape.innerRadius() : null, outerRadius: currentShape.outerRadius ? currentShape.outerRadius() : null, scaleX: currentShape.scaleX(), scaleY: currentShape.scaleY(), stroke: currentShape.stroke() || (currentShape.getChildren ? currentShape.getChildren()[0].stroke() : null), strokeWidth: currentShape.strokeWidth() || (currentShape.getChildren ? currentShape.getChildren()[0].strokeWidth() : null) };
                    broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: obj });
                }
            }
        });

        stage.on('mouseup touchend', () => {
            if (!isDrawing || isStudent) return;
            isDrawing = false;
            let finalObj = null;
            if (currentLine) {
                finalObj = { type: 'line', points: currentLine.points(), stroke: currentLine.stroke(), strokeWidth: currentLine.strokeWidth(), globalCompositeOperation: currentLine.globalCompositeOperation() };
                if (currentTool === 'pen') finalObj.smooth = true;
            } else if (currentShape) {
                if (currentShapeType === 'arrow') {
                    finalObj = { type: 'shape', shapeType: 'arrow', id: currentStrokeId, x: currentShape.x(), y: currentShape.y(), width: currentShape.getChildren()[0].points()[2], rotation: currentShape.rotation(), stroke: currentShape.getChildren()[0].stroke(), strokeWidth: currentShape.getChildren()[0].strokeWidth() };
                    createRotateAnchor(currentShape);
                } else {
                    finalObj = { type: 'shape', shapeType: currentShapeType, x: currentShape.x(), y: currentShape.y(), width: currentShape.width ? currentShape.width() : (currentShape.radiusX ? currentShape.radiusX() * 2 : 0), height: currentShape.height ? currentShape.height() : (currentShape.radiusY ? currentShape.radiusY() * 2 : 0), radius: currentShape.radius ? currentShape.radius() : null, innerRadius: currentShape.innerRadius ? currentShape.innerRadius() : null, outerRadius: currentShape.outerRadius ? currentShape.outerRadius() : null, scaleX: currentShape.scaleX(), scaleY: currentShape.scaleY(), stroke: currentShape.stroke() || (currentShape.getChildren ? currentShape.getChildren()[0].stroke() : null), strokeWidth: currentShape.strokeWidth() || (currentShape.getChildren ? currentShape.getChildren()[0].strokeWidth() : null) };
                }
            }
            if (finalObj) {
                saveObjectToDB(finalObj);
                broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: finalObj });
            }
            currentLine = null; currentShape = null;
            currentStrokeId = null;
            drawLayer.batchDraw();
        });

        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            if (e.evt.ctrlKey) {
                const oldScale = stage.scaleX();
                const pointer = stage.getPointerPosition();
                const mousePointTo = { x: (pointer.x - stage.x()) / oldScale, y: (pointer.y - stage.y()) / oldScale };
                let direction = e.evt.deltaY > 0 ? -1 : 1;
                const scaleBy = 1.05;
                let newScale = direction > 0 ? oldScale * scaleBy : oldScale / scaleBy;
                newScale = Math.max(0.1, Math.min(newScale, 5));
                stage.scale({ x: newScale, y: newScale });
                stage.position({ x: pointer.x - mousePointTo.x * newScale, y: pointer.y - mousePointTo.y * newScale });
            } else {
                stage.position({ x: stage.x() - e.evt.deltaX, y: stage.y() - e.evt.deltaY });
            }
        });

        let isPanning = false;
        let lastPointerPos = null;
        stage.on('mousedown', (e) => { if (e.evt.button === 2) { isPanning = true; lastPointerPos = stage.getPointerPosition(); } });
        stage.on('mousemove', (e) => {
            if (isPanning) {
                const pos = stage.getPointerPosition();
                if (lastPointerPos) stage.position({ x: stage.x() + (pos.x - lastPointerPos.x), y: stage.y() + (pos.y - lastPointerPos.y) });
                lastPointerPos = pos;
            }
        });
        stage.on('mouseup', () => { isPanning = false; });
        stage.container().addEventListener('contextmenu', (e) => e.preventDefault());

        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (isStudent) return;
            if (confirm('Очистить доску?')) {
                // 1. Получаем список всех объектов этой доски
                const { data: objs } = await supabaseClient.from('board_objects').select('object_data').eq('board_id', subject);
                
                // 2. Вытаскиваем имена файлов картинок (если есть)
                const fileNamesToDelete = [];
                if (objs) {
                    objs.forEach(item => {
                        if (item.object_data.type === 'image' && item.object_data.src) {
                            // Извлекаем имя файла из URL
                            const parts = item.object_data.src.split('/');
                            const fileName = parts[parts.length - 1];
                            if (fileName) fileNamesToDelete.push(fileName);
                        }
                    });
                }

                // 3. Удаляем объекты из базы
                await supabaseClient.from('board_objects').delete().eq('board_id', subject);
                
                // 4. Удаляем файлы из Storage
                if (fileNamesToDelete.length > 0) {
                    await supabaseClient.storage.from('board-images').remove(fileNamesToDelete);
                }

                // 5. Очищаем экран и синхронизируем
                drawLayer.destroyChildren(); 
                drawLayer.draw();
                removeRotateAnchor();
                broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: { type: 'clear' } });
            }
        });

        
        // --- ФУНКЦИИ ДЛЯ РАБОТЫ С КАРТИНКАМИ ---
        document.getElementById('imageBtn').addEventListener('click', () => {
            if (isStudent) return;
            document.getElementById('imageUploadInput').click();
        });

        document.getElementById('imageUploadInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // Сброс значения, чтобы можно было выбрать тот же файл снова
            e.target.value = ''; 

            try {
                // 1. Сжимаем картинку
                const compressedBlob = await compressImage(file, 1200, 0.8);
                
                // 2. Загружаем в Supabase Storage
                const fileName = `board_${Date.now()}_${Math.random().toString(36).substr(2, 5)}.jpg`;
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('board-images')
                    .upload(fileName, compressedBlob, { contentType: 'image/jpeg' });

                if (uploadError) throw uploadError;

                // 3. Получаем публичный URL
                const { data: urlData } = supabaseClient.storage.from('board-images').getPublicUrl(fileName);
                const imageUrl = urlData.publicUrl;

                // 4. Создаем Konva.Image
                const imgObj = new Image();
                imgObj.src = imageUrl;
                imgObj.onload = () => {
                    // Центрируем картинку на экране
                    const stageCenterX = (window.innerWidth / 2 - stage.x()) / stage.scaleX();
                    const stageCenterY = (window.innerHeight / 2 - stage.y()) / stage.scaleY();
                    
                    // Максимальная ширина/высота 400px
                    const maxDim = 400;
                    let w = imgObj.width;
                    let h = imgObj.height;
                    if (w > maxDim || h > maxDim) {
                        const ratio = Math.min(maxDim / w, maxDim / h);
                        w *= ratio;
                        h *= ratio;
                    }

                    const imageNode = new Konva.Image({
                        image: imgObj,
                        x: stageCenterX - w / 2,
                        y: stageCenterY - h / 2,
                        width: w,
                        height: h,
                        draggable: !isStudent
                    });
                    
                    drawLayer.add(imageNode);
                    drawLayer.batchDraw();

                    // 5. Сохраняем в базу и отправляем ученику
                    const objData = { type: 'image', x: imageNode.x(), y: imageNode.y(), width: w, height: h, src: imageUrl };
                    saveObjectToDB(objData);
                    broadcastChannel.send({ type: 'broadcast', event: 'draw', payload: objData });
                };
            } catch (err) {
                console.error('Ошибка загрузки картинки:', err);
                alert('Не удалось загрузить картинку: ' + err.message);
            }
        });

        // Функция сжатия картинки через Canvas
        function compressImage(file, maxDimension, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxDimension || height > maxDimension) {
                            const ratio = Math.min(maxDimension / width, maxDimension / height);
                            width *= ratio;
                            height *= ratio;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error('Ошибка сжатия'));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = () => reject(new Error('Ошибка чтения файла'));
                };
                reader.onerror = () => reject(new Error('Ошибка чтения файла'));
            });
        }

async function saveObjectToDB(obj) { 
            const { error } = await supabaseClient.from('board_objects').insert([{ board_id: subject, object_data: obj }]); 
            if (error) console.error('Ошибка сохранения в базу:', error);
        }

        function drawObject(obj) {
            let node = null;
            if (obj.type === 'line') {
                const lineAttrs = { points: obj.points, stroke: obj.stroke, strokeWidth: obj.strokeWidth, lineCap: 'round', lineJoin: 'round', globalCompositeOperation: obj.globalCompositeOperation };
                if (obj.smooth === true) lineAttrs.tension = 0.5;
                node = new Konva.Line(lineAttrs);
            } else if (obj.type === 'shape') {
                if (obj.shapeType === 'rect') node = new Konva.Rect({ x: obj.x, y: obj.y, width: obj.width, height: obj.height, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'circle') node = new Konva.Ellipse({ x: obj.x, y: obj.y, radiusX: obj.width/2, radiusY: obj.height/2, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'triangle') node = new Konva.RegularPolygon({ x: obj.x, y: obj.y, sides: 3, radius: obj.radius, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'diamond') node = new Konva.RegularPolygon({ x: obj.x, y: obj.y, sides: 4, radius: obj.radius, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'star') node = new Konva.Star({ x: obj.x, y: obj.y, numPoints: 5, innerRadius: obj.innerRadius, outerRadius: obj.outerRadius, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'arrow') {
                    node = new Konva.Group({ x: obj.x, y: obj.y, rotation: obj.rotation || 0 });
                    node.id(obj.id);
                    node.add(new Konva.Line({ points: [0, 0, obj.width, 0], stroke: obj.stroke, strokeWidth: obj.strokeWidth, lineCap: 'round' }));
                    node.add(new Konva.Line({ points: [obj.width, 0, obj.width - 15, -8, obj.width - 15, 8, obj.width, 0], fill: obj.stroke, stroke: obj.stroke, closed: true, strokeWidth: 1 }));
                    node.getChildren()[0].name('arrow-line');
                }
            } else if (obj.type === 'text') {
                node = new Konva.Text({ x: obj.x, y: obj.y, text: obj.text, fontSize: obj.fontSize, fill: obj.fill, fontFamily: 'Inter', draggable: !isStudent });
            } else if (obj.type === 'image') {
                const imgObj = new Image();
                imgObj.src = obj.src;
                imgObj.onload = () => {
                    const imageNode = new Konva.Image({
                        image: imgObj, x: obj.x, y: obj.y, width: obj.width, height: obj.height, draggable: !isStudent
                    });
                    drawLayer.add(imageNode);
                    drawLayer.batchDraw();
                };
                // Возвращаем null, так как картинка добавляется асинхронно внутри onload
                node = null; 
            }
            if (node) {
                drawLayer.add(node);
                drawLayer.batchDraw();
                if (obj.id) studentObjects[obj.id] = node;
            }
        }

        async function loadBoard() {
            const { data } = await supabaseClient.from('board_objects').select('*').eq('board_id', subject).order('created_at', { ascending: true });
            if (data) {
                data.forEach(item => drawObject(item.object_data));
            }
        }

        function setupRealtime() {
            broadcastChannel = supabaseClient.channel(`board_${subject}`, { config: { broadcast: { self: false } } });
            broadcastChannel
                .on('broadcast', { event: 'draw' }, payload => {
                    if (isStudent) {
                        const data = payload.payload;
                        if (data.type === 'clear') {
                            drawLayer.destroyChildren(); drawLayer.draw(); studentObjects = {};
                        } else {
                            if (data.id && studentObjects[data.id]) {
                                const node = studentObjects[data.id];
                                if (data.type === 'line') {
                                    node.points(data.points);
                                } else if (data.type === 'shape') {
                                    if (data.shapeType === 'arrow') {
                                        node.x(data.x); node.y(data.y); node.rotation(data.rotation || 0);
                                        const line = node.getChildren()[0];
                                        const head = node.getChildren()[1];
                                        if (line) line.points([0, 0, data.width, 0]);
                                        if (head) head.points([data.width, 0, data.width - 15, -8, data.width - 15, 8, data.width, 0]);
                                    } else {
                                        node.setAttrs({ x: data.x, y: data.y, width: data.width, height: data.height, radius: data.radius, scaleX: data.scaleX, scaleY: data.scaleY });
                                    }
                                }
                                drawLayer.batchDraw();
                            } else {
                                drawObject(data);
                            }
                        }
                    }
                })
                .on('broadcast', { event: 'cursor' }, payload => {
                    if (isStudent) {
                        const pos = payload.payload;
                        if (!teacherCursor) {
                            teacherCursor = new Konva.Circle({ x: pos.x, y: pos.y, radius: 8, fill: 'rgba(197, 240, 90, 0.5)', stroke: '#c5f05a', strokeWidth: 2, listening: false });
                            uiLayer.add(teacherCursor);
                        } else {
                            teacherCursor.position({ x: pos.x, y: pos.y });
                        }
                        uiLayer.batchDraw();
                    }
                })
                .subscribe();
        }

        window.addEventListener('resize', () => { stage.width(window.innerWidth); stage.height(window.innerHeight); });

        loadBoard();
        setupRealtime();
    </script>
</body>
