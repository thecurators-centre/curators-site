<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Интерактивная доска | The Curator’s</title>
    <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #25283d; --card-bg: #313452; --accent-lime: #c5f05a; --text-main: #f4f3ee; }
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); height: 100vh; }
        
        .toolbar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg); padding: 10px 20px; border-radius: 20px;
            display: flex; gap: 10px; align-items: center; z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap; justify-content: center; width: max-content; max-width: 95vw;
        }
        .tool-btn {
            background: none; border: none; color: var(--text-main); cursor: pointer;
            padding: 8px 12px; border-radius: 10px; font-size: 1.2rem; transition: 0.2s;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .tool-btn.active { background: var(--accent-lime); color: var(--bg-color); }
        .color-picker { width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer; padding: 0; }
        
        .slider-container { display: flex; align-items: center; gap: 8px; }
        .slider-container input[type="range"] { width: 80px; accent-color: var(--accent-lime); cursor: pointer; }
        .slider-label { font-size: 0.8rem; opacity: 0.7; width: 20px; text-align: center; }

        /* Меню фигур */
        .shape-menu {
            display: none; position: absolute; top: 100%; left: 0;
            background: var(--card-bg); border-radius: 10px; padding: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); z-index: 1002; border: 1px solid rgba(255,255,255,0.1);
            grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; width: max-content;
        }
        .shape-menu.active { display: grid; }
        .shape-menu button {
            background: none; border: none; color: white; padding: 10px 15px;
            text-align: left; cursor: pointer; font-size: 1rem; border-radius: 5px;
            white-space: nowrap;
        }
        .shape-menu button:hover { background: rgba(255,255,255,0.1); }

        .board-title {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--card-bg); padding: 10px 20px; border-radius: 10px;
            font-size: 1.2rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.1);
        }

        #container { width: 100vw; height: 100vh; background-color: #1a1c29; cursor: crosshair; position: relative; }
        
        .text-input-overlay {
            position: absolute; z-index: 1000; background: transparent; border: 1px dashed var(--accent-lime);
            color: white; font-family: 'Inter', sans-serif; outline: none; resize: none; overflow: hidden;
        }

        .exit-btn {
            position: absolute; bottom: 20px; right: 20px; background: var(--card-bg);
            color: var(--text-main); padding: 10px 20px; border-radius: 10px; text-decoration: none;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s;
        }
        .exit-btn:hover { background: #ff6b6b; color: white; }
    </style>
</head>
<body>

    <div class="board-title" id="boardTitle">Загрузка...</div>

    <div class="toolbar" id="toolbar">
        <button class="tool-btn active" data-tool="pen" title="Карандаш">✏️</button>
        <button class="tool-btn" data-tool="eraser" title="Ластик">🧽</button>
        
        <div style="position: relative;">
            <button class="tool-btn" id="shapeBtn" title="Фигуры">⬛</button>
            <div class="shape-menu" id="shapeMenu">
                <button data-shape="rect">⬛ Прямоугольник</button>
                <button data-shape="circle">⭕ Круг</button>
                <button data-shape="triangle">🔺 Треугольник</button>
                <button data-shape="diamond">🔷 Ромб</button>
                <button data-shape="star">⭐ Звезда</button>
                <button data-shape="xy">📈 График XY</button>
            </div>
        </div>

        <button class="tool-btn" data-tool="text" title="Текст">📝</button>
        <input type="color" id="colorPicker" class="color-picker" value="#c5f05a" title="Цвет">
        
        <div class="slider-container">
            <span style="font-size: 1rem;">🔹</span>
            <input type="range" id="strokeWidth" min="1" max="100" value="4">
            <span class="slider-label" id="strokeVal">4</span>
        </div>

        <button class="tool-btn" id="clearBtn" title="Очистить" style="color: #ff6b6b;">🗑️</button>
    </div>

    <div id="container"></div>

    <a href="admin.html" class="exit-btn" id="backBtn">Выйти</a>

    <script>
        const SUPABASE_URL = 'https://kajvldevytbrkeomwlms.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__PdBbe6y-EKJ0z4DfPrKKQ_ru9yogqW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const subject = urlParams.get('subject') || 'Общая доска';
        const isStudent = urlParams.get('role') === 'student';
        
        document.getElementById('boardTitle').innerText = `Доска: ${subject}`;
        
        if (isStudent) {
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('backBtn').href = 'student.html';
            document.getElementById('backBtn').innerText = 'Вернуться в кабинет';
        }

        const stage = new Konva.Stage({ container: 'container', width: window.innerWidth, height: window.innerHeight });
        
        // Два слоя: один для фона (сетки), другой для рисования
        const bgLayer = new Konva.Layer({ listening: false });
        const layer = new Konva.Layer();
        stage.add(bgLayer);
        stage.add(layer);

        // --- СЕТКА (ОПТИМИЗИРОВАННАЯ) ---
        // Рисуем сетку только на размер экрана + запас, и повторяем её при движении
        function drawGrid() {
            bgLayer.destroyChildren();
            const spacing = 20;
            // Рисуем чуть больше экрана, чтобы при сдвиге не было пустоты
            const width = window.innerWidth + 100; 
            const height = window.innerHeight + 100;
            
            const grid = new Konva.Shape({
                sceneFunc: function(context) {
                    context.beginPath();
                    for (let x = 0; x < width; x += spacing) {
                        for (let y = 0; y < height; y += spacing) {
                            context.moveTo(x, y);
                            context.arc(x, y, 1, 0, Math.PI * 2);
                        }
                    }
                    context.fillStyle = 'rgba(255,255,255,0.1)'; // Чуть ярче для видимости
                    context.fill();
                }
            });
            
            // Позиционируем сетку так, чтобы она двигалась вместе с камерой
            // Но поскольку мы не можем бесконечно двигать один Shape, мы будем перерисовывать его при движении
            grid.x(stage.x() % spacing);
            grid.y(stage.y() % spacing);
            
            bgLayer.add(grid);
            bgLayer.batchDraw();
        }

        // Центрируем доску
        stage.position({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
        stage.scale({ x: 1, y: 1 });
        drawGrid(); // Первая отрисовка

        let currentTool = 'pen';
        let currentShapeType = 'rect';
        let isDrawing = false;
        let currentLine = null;
        let currentShape = null;
        let startX, startY;
        let activeTextInput = null;
        
        const colorPicker = document.getElementById('colorPicker');
        const strokeWidthSlider = document.getElementById('strokeWidth');
        const strokeVal = document.getElementById('strokeVal');

        strokeWidthSlider.addEventListener('input', (e) => { strokeVal.innerText = e.target.value; });

        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (isStudent) return;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('shapeMenu').classList.remove('active');
                e.currentTarget.classList.add('active');
                currentTool = e.currentTarget.dataset.tool;
            });
        });

        // ИСПРАВЛЕННАЯ ЛОГИКА МЕНЮ ФИГУР
        const shapeBtn = document.getElementById('shapeBtn');
        const shapeMenu = document.getElementById('shapeMenu');
        
        shapeBtn.onclick = (e) => {
            e.stopPropagation();
            shapeMenu.classList.toggle('active');
        };

        document.querySelectorAll('#shapeMenu button').forEach(btn => {
            btn.onclick = (e) => {
                currentShapeType = e.currentTarget.dataset.shape;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                shapeBtn.classList.add('active');
                currentTool = 'shape';
                shapeMenu.classList.remove('active');
            };
        });

        // --- ТЕКСТ ---
        stage.on('click tap', (e) => {
            if (currentTool !== 'text' || isStudent) return;
            if (activeTextInput) { activeTextInput.remove(); activeTextInput = null; }

            const pos = stage.getPointerPosition();
            const localX = (pos.x - stage.x()) / stage.scaleX();
            const localY = (pos.y - stage.y()) / stage.scaleY();

            const textarea = document.createElement('textarea');
            textarea.className = 'text-input-overlay';
            textarea.style.left = `${pos.x}px`;
            textarea.style.top = `${pos.y}px`;
            textarea.style.fontSize = `${parseInt(strokeWidthSlider.value) * 4 * stage.scaleX()}px`;
            textarea.style.color = colorPicker.value;
            textarea.style.width = '200px';
            textarea.style.height = '50px';
            
            document.getElementById('container').appendChild(textarea);
            textarea.focus();
            activeTextInput = textarea;

            textarea.onblur = () => {
                const text = textarea.value.trim();
                if (text) {
                    const fontSize = parseInt(strokeWidthSlider.value) * 4;
                    const textNode = new Konva.Text({ x: localX, y: localY, text: text, fontSize: fontSize, fill: colorPicker.value, fontFamily: 'Inter', draggable: !isStudent });
                    layer.add(textNode);
                    layer.batchDraw();
                    saveObjectToDB({ type: 'text', x: localX, y: localY, text: text, fontSize: fontSize, fill: colorPicker.value });
                }
                textarea.remove();
                activeTextInput = null;
            };
        });

        // --- РИСОВАНИЕ ---
        stage.on('mousedown touchstart', (e) => {
            if (isStudent || currentTool === 'text') return;
            if (e.evt.touches && e.evt.touches.length > 1) return;

            isDrawing = true;
            const pos = stage.getPointerPosition();
            startX = (pos.x - stage.x()) / stage.scaleX();
            startY = (pos.y - stage.y()) / stage.scaleY();

            const width = parseInt(strokeWidthSlider.value);
            const color = colorPicker.value;

            if (currentTool === 'pen') {
                currentLine = new Konva.Line({ stroke: color, strokeWidth: width, lineCap: 'round', lineJoin: 'round', points: [startX, startY], globalCompositeOperation: 'source-over' });
                layer.add(currentLine);
            } 
            else if (currentTool === 'eraser') {
                currentLine = new Konva.Line({ stroke: '#000', strokeWidth: width * 2, lineCap: 'round', lineJoin: 'round', points: [startX, startY], globalCompositeOperation: 'destination-out' });
                layer.add(currentLine);
            } 
            else if (currentTool === 'shape') {
                if (currentShapeType === 'rect') currentShape = new Konva.Rect({ x: startX, y: startY, width: 0, height: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'circle') currentShape = new Konva.Ellipse({ x: startX, y: startY, radiusX: 0, radiusY: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'triangle') currentShape = new Konva.RegularPolygon({ x: startX, y: startY, sides: 3, radius: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'diamond') currentShape = new Konva.RegularPolygon({ x: startX, y: startY, sides: 4, radius: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'star') currentShape = new Konva.Star({ x: startX, y: startY, numPoints: 5, innerRadius: 0, outerRadius: 0, stroke: color, strokeWidth: width, fill: 'transparent' });
                else if (currentShapeType === 'xy') {
                    currentShape = new Konva.Group({ x: startX, y: startY });
                    currentShape.add(new Konva.Line({ points: [0, 0, 100, 0], stroke: color, strokeWidth: width }));
                    currentShape.add(new Konva.Line({ points: [0, 0, 0, -100], stroke: color, strokeWidth: width }));
                    currentShape.add(new Konva.Line({ points: [90, -5, 100, 0, 90, 5], stroke: color, strokeWidth: width, fill: color }));
                    currentShape.add(new Konva.Line({ points: [-5, -90, 0, -100, 5, -90], stroke: color, strokeWidth: width, fill: color }));
                }
                layer.add(currentShape);
            }
            layer.batchDraw();
        });

        stage.on('mousemove touchmove', (e) => {
            if (!isDrawing || isStudent) return;
            if (e.evt.touches && e.evt.touches.length > 1) return;
            const pos = stage.getPointerPosition();
            const localX = (pos.x - stage.x()) / stage.scaleX();
            const localY = (pos.y - stage.y()) / stage.scaleY();

            if (currentTool === 'pen' || currentTool === 'eraser') {
                if (currentLine) currentLine.points(currentLine.points().concat([localX, localY]));
            } 
            else if (currentTool === 'shape' && currentShape) {
                const w = localX - startX; const h = localY - startY;
                if (currentShapeType === 'rect') {
                    currentShape.x(w < 0 ? localX : startX); currentShape.width(Math.abs(w));
                    currentShape.y(h < 0 ? localY : startY); currentShape.height(Math.abs(h));
                } else if (currentShapeType === 'circle') {
                    currentShape.radiusX(Math.abs(w)); currentShape.radiusY(Math.abs(h));
                    currentShape.x(startX + w / 2); currentShape.y(startY + h / 2);
                } else if (['triangle', 'diamond', 'star'].includes(currentShapeType)) {
                    const dist = Math.sqrt(w*w + h*h);
                    if (currentShapeType === 'star') { currentShape.outerRadius(dist); currentShape.innerRadius(dist * 0.4); }
                    else { currentShape.radius(dist); }
                } else if (currentShapeType === 'xy') {
                    const scale = Math.sqrt(w*w + h*h) / 100;
                    currentShape.scale({ x: scale, y: scale });
                }
            }
            layer.batchDraw();
        });

        stage.on('mouseup touchend', () => {
            if (!isDrawing || isStudent) return;
            isDrawing = false;
            
            if (currentLine) {
                saveObjectToDB({ type: 'line', points: currentLine.points(), stroke: currentLine.stroke(), strokeWidth: currentLine.strokeWidth(), globalCompositeOperation: currentLine.globalCompositeOperation() });
            } else if (currentShape) {
                saveObjectToDB({
                    type: 'shape', shapeType: currentShapeType, x: currentShape.x(), y: currentShape.y(),
                    width: currentShape.width ? currentShape.width() : (currentShape.radiusX ? currentShape.radiusX() * 2 : 0),
                    height: currentShape.height ? currentShape.height() : (currentShape.radiusY ? currentShape.radiusY() * 2 : 0),
                    radius: currentShape.radius ? currentShape.radius() : null, innerRadius: currentShape.innerRadius ? currentShape.innerRadius() : null, outerRadius: currentShape.outerRadius ? currentShape.outerRadius() : null,
                    scaleX: currentShape.scaleX(), scaleY: currentShape.scaleY(),
                    stroke: currentShape.stroke() || (currentShape.getChildren ? currentShape.getChildren()[0].stroke() : null),
                    strokeWidth: currentShape.strokeWidth() || (currentShape.getChildren ? currentShape.getChildren()[0].strokeWidth() : null)
                });
            }
            currentLine = null; currentShape = null;
            layer.batchDraw();
        });

        // --- УПРАВЛЕНИЕ ---
        stage.on('wheel', (e) => {
            e.evt.preventDefault();
            if (e.evt.ctrlKey) {
                const oldScale = stage.scaleX(); const pointer = stage.getPointerPosition();
                const mousePointTo = { x: (pointer.x - stage.x()) / oldScale, y: (pointer.y - stage.y()) / oldScale };
                let direction = e.evt.deltaY > 0 ? -1 : 1;
                let newScale = direction > 0 ? oldScale * 1.05 : oldScale / 1.05;
                newScale = Math.max(0.1, Math.min(newScale, 5));
                stage.scale({ x: newScale, y: newScale });
                stage.position({ x: pointer.x - mousePointTo.x * newScale, y: pointer.y - mousePointTo.y * newScale });
            } else {
                stage.position({ x: stage.x() - e.evt.deltaX, y: stage.y() - e.evt.deltaY });
            }
            drawGrid(); // Перерисовываем сетку при движении
            saveCameraState();
        });

        let isPanning = false; let lastPointerPos = null;
        stage.on('mousedown', (e) => { if (e.evt.button === 2) { isPanning = true; lastPointerPos = stage.getPointerPosition(); } });
        stage.on('mousemove', (e) => {
            if (isPanning) {
                const pos = stage.getPointerPosition();
                if (lastPointerPos) stage.position({ x: stage.x() + (pos.x - lastPointerPos.x), y: stage.y() + (pos.y - lastPointerPos.y) });
                lastPointerPos = pos; 
                drawGrid(); // Перерисовываем сетку
                saveCameraState();
            }
        });
        stage.on('mouseup', () => { isPanning = false; });
        stage.container().addEventListener('contextmenu', (e) => e.preventDefault());

        // --- БАЗА ---
        async function saveObjectToDB(obj) { await supabaseClient.from('board_objects').insert([{ board_id: subject, object_data: obj }]); }
        async function saveCameraState() { if (isStudent) return; const camState = { type: 'camera', x: stage.x(), y: stage.y(), scale: stage.scaleX() }; await supabaseClient.from('board_objects').insert([{ board_id: subject, object_data: camState }]); }

        function drawObject(obj) {
            if (obj.type === 'line') {
                layer.add(new Konva.Line({ points: obj.points, stroke: obj.stroke, strokeWidth: obj.strokeWidth, lineCap: 'round', lineJoin: 'round', globalCompositeOperation: obj.globalCompositeOperation }));
            } else if (obj.type === 'shape') {
                let shape;
                if (obj.shapeType === 'rect') shape = new Konva.Rect({ x: obj.x, y: obj.y, width: obj.width, height: obj.height, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'circle') shape = new Konva.Ellipse({ x: obj.x, y: obj.y, radiusX: obj.width/2, radiusY: obj.height/2, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'triangle') shape = new Konva.RegularPolygon({ x: obj.x, y: obj.y, sides: 3, radius: obj.radius, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'diamond') shape = new Konva.RegularPolygon({ x: obj.x, y: obj.y, sides: 4, radius: obj.radius, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'star') shape = new Konva.Star({ x: obj.x, y: obj.y, numPoints: 5, innerRadius: obj.innerRadius, outerRadius: obj.outerRadius, stroke: obj.stroke, strokeWidth: obj.strokeWidth, fill: 'transparent' });
                else if (obj.shapeType === 'xy') {
                    shape = new Konva.Group({ x: obj.x, y: obj.y, scaleX: obj.scaleX, scaleY: obj.scaleY });
                    shape.add(new Konva.Line({ points: [0, 0, 100, 0], stroke: obj.stroke, strokeWidth: obj.strokeWidth }));
                    shape.add(new Konva.Line({ points: [0, 0, 0, -100], stroke: obj.stroke, strokeWidth: obj.strokeWidth }));
                    shape.add(new Konva.Line({ points: [90, -5, 100, 0, 90, 5], stroke: obj.stroke, strokeWidth: obj.strokeWidth }));
                    shape.add(new Konva.Line({ points: [-5, -90, 0, -100, 5, -90], stroke: obj.stroke, strokeWidth: obj.strokeWidth }));
                }
                layer.add(shape);
            } else if (obj.type === 'text') {
                layer.add(new Konva.Text({ x: obj.x, y: obj.y, text: obj.text, fontSize: obj.fontSize, fill: obj.fill, fontFamily: 'Inter', draggable: !isStudent }));
            }
            layer.batchDraw();
        }

        async function loadBoard() {
            const { data } = await supabaseClient.from('board_objects').select('*').eq('board_id', subject).order('created_at', { ascending: true });
            if (data) {
                let lastCamera = null;
                data.forEach(item => {
                    if (item.object_data.type === 'camera') lastCamera = item.object_data;
                    else drawObject(item.object_data);
                });
                if (lastCamera) { stage.position({ x: lastCamera.x, y: lastCamera.y }); stage.scale({ x: lastCamera.scale, y: lastCamera.scale }); drawGrid(); }
            }
        }

        supabaseClient.channel('board_realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'board_objects' }, payload => {
            if (payload.new.board_id === subject) {
                const data = payload.new.object_data;
                if (data.type === 'camera') { if (isStudent) { stage.position({ x: data.x, y: data.y }); stage.scale({ x: data.scale, y: data.scale }); drawGrid(); } }
                else { drawObject(data); }
            }
        }).subscribe();

        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (isStudent) return;
            if (confirm('Очистить доску?')) {
                layer.destroyChildren(); layer.draw();
                drawGrid();
                await supabaseClient.from('board_objects').delete().eq('board_id', subject);
            }
        });

        window.addEventListener('resize', () => { stage.width(window.innerWidth); stage.height(window.innerHeight); layer.batchDraw(); drawGrid(); });

        loadBoard();
    </script>
</body>
</html>
