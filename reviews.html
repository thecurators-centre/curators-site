<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com;">
    <title>Отзывы | The Curator’s</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Уникальные стили для заглушки "Отзывы" */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .construction-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 140px 10% 60px;
            background: radial-gradient(circle at center, #313452 0%, #25283d 100%);
        }
        .construction-wrapper h1 {
            font-size: clamp(2rem, 6vw, 3.6rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--accent-lime);
            max-width: 900px;
        }
        .construction-wrapper p {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            opacity: 0.7;
            max-width: 760px;
            margin: 0 auto;
            font-weight: 300;
        }
        .fun-text {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 15px;
            font-weight: 400;
        }
        .small-text {
            font-size: 0.9rem;
            opacity: 0.5;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img">
        </a>
        <nav id="nav-menu">
            <a href="about.html">О нас</a>
            <a href="reviews.html">Отзывы</a>
            <a href="payment.html">Оплата</a>
            <a href="contacts.html">Контакты</a>
            <a href="login.html">Вход</a>
            <a href="enroll.html" class="btn-header">Записаться</a>
        </nav>
        <div class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <section class="construction-wrapper">
        <div class="fun-text">Ой, кажется кто-то из кураторов напортачил!</div>
        <h1>Страница в разработке</h1>
        <p class="small-text">Ведутся технические работы, приносим свои извинения.</p>
    </section>

    <footer>
        &copy; 2026 The Curator’s. Все права защищены. <br>
        Прогресс, у которого есть маршрут.
    </footer>

    <script>
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav-menu');
        burger.addEventListener('click', () => {
            burger.classList.toggle('active');
            nav.classList.toggle('active');
        });
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                burger.classList.remove('active');
                nav.classList.remove('active');
            });
        });
    </script>
</body>
</html>
